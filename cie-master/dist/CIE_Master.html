          <button class="btn sm" id="freset">Reset</button>
        </div>
        <div class="grid g4">
          <div class="card kpi"><div class="label">Facilities</div><div class="value">${CIE.num(rows.length)}</div><div class="foot">of ${CIE.num(all.length)} in the dataset</div></div>
          <div class="card kpi"><div class="label">Observed infections</div><div class="value">${CIE.num(totO)}</div><div class="foot">predicted ${CIE.num(totP)}</div></div>
          <div class="card kpi"><div class="label">Excess cases above predicted</div><div class="value">${CIE.num(totEx)}</div><div class="foot">pooled SIR ${totP ? (totO / totP).toFixed(2) : '—'} across all measures</div></div>
          <div class="card kpi"><div class="label">Worse than national on ≥1 measure</div><div class="value">${CIE.num(rows.filter((r) => worseCount(r) > 0).length)}</div><div class="foot">${CIE.num(rows.filter((r) => r.hacPenalty).length)} with a HAC payment penalty</div></div>
        </div>
        <div class="grid g2" style="margin-top:16px">
          <div class="card"><div class="card-head"><h3>Pooled SIR by measure</h3><span class="sub">Σ observed ÷ Σ predicted · tick = 1.0</span></div>
            ${CIE.charts.barList(P.map((x) => ({ label: x.ms.name, value: x.sir == null ? 0 : +x.sir.toFixed(2), color: x.sir > 1 ? 'var(--div-r3)' : 'var(--div-b3)', marker: 1 / maxSir, tip: `${x.ms.full || x.ms.name}: pooled SIR ${x.sir == null ? 'n/a' : x.sir.toFixed(2)} across ${x.rep} reporting facilities` })), { max: maxSir, labelWidth: 120, width: 520, format: (v) => v.toFixed(2), title: 'Pooled SIR' })}</div>
          <div class="card"><div class="card-head"><h3>Facilities worse than national, by measure</h3><span class="sub">count with SIR above 1.0</span></div>
            ${CIE.charts.barList(P.map((x) => ({ label: x.ms.name, value: x.worse, color: 'var(--s2)', tip: `${x.ms.name}: ${x.worse} of ${x.rep} reporting facilities above 1.0` })), { labelWidth: 120, width: 520, title: 'Worse than national' })}</div>
        </div>
        <div class="legend" style="margin:16px 0 8px"><span>SIR:</span>${['b3', 'b2', 'b1', 'mid', 'r1', 'r2', 'r3'].map((c, i) => `<span><i class="sir ${c}" style="width:22px"></i>${['<0.5', '0.5–0.8', '0.8–0.95', '≈1.0', '1.05–1.25', '1.25–1.6', '>1.6'][i]}</span>`).join('')}</div>
        <div class="table-wrap"><table class="hai"><thead><tr>${th('priority', 'Priority', 'r')}${th('name', 'Facility')}<th>State</th>${th('beds', 'Beds', 'r')}${th('observed', 'Observed', 'r')}${th('excess', 'Excess', 'r')}${Q.measures.map((ms) => th(ms.key, esc(ms.name), 'r')).join('')}<th>Leapfrog</th><th>HAC</th></tr></thead>
          <tbody>${rows.slice(0, view.shown).map((r) => `<tr class="clickable" data-f="${esc(r.id)}"><td class="r num">${r.priority != null ? r.priority : ''}</td><td><b>${esc(r.name)}</b><div class="small muted">${esc(r.city || '')}</div></td><td>${esc(r.state || '')}</td><td class="r num">${CIE.num(r.beds)}</td><td class="r num">${CIE.num(observedOf(r))}</td><td class="r num">${excessOf(r).toFixed(1)}</td>${Q.measures.map((ms) => sirCell(r.m[ms.key])).join('')}<td>${esc(r.leapfrog || '')}</td><td>${r.hacPenalty ? '<span class="status serious">penalty</span>' : ''}</td></tr>`).join('') || `<tr><td colspan="${8 + Q.measures.length}" class="muted">No facilities match.</td></tr>`}</tbody></table></div>
        ${rows.length > view.shown ? `<div class="row" style="justify-content:center;margin-top:10px"><button class="btn" id="more">Show ${Math.min(200, rows.length - view.shown)} more (${CIE.num(rows.length - view.shown)} hidden)</button></div>` : ''}`;

      const re = () => { view.shown = 100; ctx.rerender(); };
      const q = root.querySelector('#fq');
      q.oninput = () => { view.q = q.value; clearTimeout(q._t); q._t = setTimeout(() => { re(); const n = document.getElementById('fq'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 300); };
      [['#fs', 'state'], ['#ft', 'type'], ['#fg', 'grade']].forEach(([s, k]) => { const el = root.querySelector(s); if (el) el.onchange = () => { view[k] = el.value; re(); }; });
      root.querySelector('#fb').onchange = (e) => { view.minBeds = Number(e.target.value) || 0; re(); };
      root.querySelector('#fw').onchange = (e) => { view.worse = e.target.checked; re(); };
      root.querySelector('#fh').onchange = (e) => { view.hac = e.target.checked; re(); };
      root.querySelector('#freset').onclick = () => { Object.assign(view, { q: '', state: '', type: '', grade: '', worse: false, hac: false, minBeds: 0, sort: 'priority', dir: -1 }); re(); };
      root.querySelectorAll('[data-sort]').forEach((t) => (t.onclick = () => { if (view.sort === t.dataset.sort) view.dir *= -1; else { view.sort = t.dataset.sort; view.dir = t.dataset.sort === 'name' ? 1 : -1; } ctx.rerender(); }));
      root.querySelectorAll('tr[data-f]').forEach((tr) => (tr.onclick = () => CIE.openFacility(ctx, tr.dataset.f)));
      const more = root.querySelector('#more'); if (more) more.onclick = () => { view.shown += 200; ctx.rerender(); };
      const pr = root.querySelector('#present'); if (pr) pr.onclick = () => CIE.presentFacility(ctx, rows[0].id);
      root.querySelector('#csv').onclick = () => {
        const cols = [{ label: 'Facility ID', get: (r) => r.id }, { label: 'Facility', get: (r) => r.name }, { label: 'City', get: (r) => r.city }, { label: 'State', get: (r) => r.state }, { label: 'Beds', get: (r) => r.beds }, { label: 'Priority', get: (r) => r.priority }, { label: 'Observed total', get: observedOf }, { label: 'Excess total', get: (r) => excessOf(r).toFixed(2) }]
          .concat(Q.measures.flatMap((ms) => [{ label: ms.name + ' observed', get: (r) => (r.m[ms.key] || [])[0] }, { label: ms.name + ' predicted', get: (r) => (r.m[ms.key] || [])[1] }, { label: ms.name + ' SIR', get: (r) => (r.m[ms.key] || [])[2] }, { label: ms.name + ' denominator', get: (r) => (r.m[ms.key] || [])[3] }]))
          .concat([{ label: 'Leapfrog', get: (r) => r.leapfrog }, { label: 'HAC penalty', get: (r) => (r.hacPenalty ? 'Yes' : 'No') }]);
        CIE.download(CIE.slug(ws.name) + '-facility-quality.csv', CIE.toCSV(rows, cols), 'text/csv');
      };
    },
  });
})();

  <script>/* js/modules/market.js */
/* Market model: editable Low/Base/High segment scenarios, named-account view, sales-capacity model. */
(function () {
  'use strict';
  const CIE = window.CIE, esc = CIE.esc;
  const SC = ['low', 'base', 'high'];
  const SCL = { low: 'Low', base: 'Base', high: 'High' };

  // buying units = round_half_up(count × share retained × workflow-fit share); users = units × users/unit; pool = users × price
  CIE.marketCalc = function (m) {
    const out = { low: { units: 0, users: 0, pool: 0 }, base: { units: 0, users: 0, pool: 0 }, high: { units: 0, users: 0, pool: 0 }, rows: [] };
    m.segments.forEach((s) => {
      const r = { s };
      SC.forEach((k, i) => {
        const units = CIE.roundHalfUp((Number(s.count) || 0) * (Number(s.retain[i]) || 0) * (Number(s.fit[i]) || 0));
        const users = units * (Number(s.upu[i]) || 0);
        const pool = users * (Number(m.prices[k]) || 0);
        r[k] = { units, users, pool };
        if (!s.expansion) { out[k].units += units; out[k].users += users; out[k].pool += pool; }
      });
      out.rows.push(r);
    });
    return out;
  };

  CIE.registerModule({
    id: 'market',
    group: 'market',
    title: 'Market model',
    order: 20,
    describe: 'Low/Base/High market sizing by segment plus a seller-capacity model.',
    render(root, ctx) {
      const ws = ctx.ws, m = ws.market;
      const calc = CIE.marketCalc(m);
      const named = ws.accounts.reduce((s, a) => s + (Number(a.value.users) || 0), 0);
      const cap = m.capacity;
      const yr = [1, 2, 3].map((y) => {
        const months = y === 1 ? Math.max(0, 12 - cap.rampMonths) : 12;
        const newArr = cap.reps * (months / 12) * cap.dealsPerRep * cap.acv;
        return { y, newArr };
      });
      let book = 0;
      yr.forEach((r) => { book = book * cap.expansion + r.newArr; r.book = book; });
      const inp = (path, v, step) => `<input type="number" step="${step || 'any'}" data-p="${path}" value="${v}">`;

      root.innerHTML = `
        <div class="page-head"><div><h2>Market model</h2><p>Buying units = count × share retained × workflow-fit share (rounded half up). Users = units × users per unit. Pool = users × price. Expansion segments are shown but not added, to avoid double counting.</p></div>
          <div class="row"><button class="btn" id="addSeg">+ Add segment</button></div></div>
        <div class="grid g3">${SC.map((k) => `<div class="card kpi"><div class="label">${SCL[k]} annual pool</div><div class="value">${CIE.money(calc[k].pool)}</div><div class="foot">${CIE.num(calc[k].units)} buying units · ${CIE.num(calc[k].users)} users · ${CIE.money(m.prices[k])}/${esc(ws.offering.unit)}</div></div>`).join('')}</div>
        <div class="grid g2" style="margin-top:16px">
          <div class="card"><div class="card-head"><h3>Pool by segment</h3><span class="sub">core segments only</span></div>
            ${CIE.charts.columns(calc.rows.filter((r) => !r.s.expansion).map((r) => ({ label: r.s.name.length > 12 ? r.s.name.slice(0, 11) + '…' : r.s.name, values: SC.map((k) => r[k].pool) })), SC.map((k, i) => ({ label: SCL[k], color: ['var(--s3)', 'var(--s1)', 'var(--s7)'][i] })), { title: 'Pool by segment and scenario' })}</div>
          <div class="card"><div class="card-head"><h3>Reality checks</h3></div>
            <dl class="kv"><dt>Named-account view</dt><dd>${CIE.num(named)} users across ${ws.accounts.length} researched accounts = <b>${CIE.money(named * ws.offering.price)}</b> / yr at the planning price. Compare with the Base pool: the gap is the long tail you must reach with a repeatable motion.</dd>
            <dt>Prices</dt><dd class="row">${SC.map((k) => `<label class="field">${SCL[k]} ${inp('prices.' + k, m.prices[k], 100)}</label>`).join('')}</dd></dl></div>
        </div>
        <div class="card" style="margin-top:16px"><div class="card-head"><h3>Segment assumptions</h3><span class="sub">edit any cell · values are shares (0–1) except count and users/unit</span></div>
          <div class="table-wrap"><table><thead><tr><th>Segment</th><th class="r">Count</th>${SC.map((k) => `<th class="r">${SCL[k]} retain</th><th class="r">${SCL[k]} fit</th><th class="r">${SCL[k]} users/unit</th>`).join('')}<th class="r">Base pool</th><th>Expansion only</th><th></th></tr></thead>
          <tbody>${calc.rows.map((r, i) => `<tr><td><input data-p="segments.${i}.name" value="${esc(r.s.name)}" style="min-width:150px"></td><td>${inp(`segments.${i}.count`, r.s.count, 1)}</td>
            ${SC.map((k, j) => `<td>${inp(`segments.${i}.retain.${j}`, r.s.retain[j], 0.05)}</td><td>${inp(`segments.${i}.fit.${j}`, r.s.fit[j], 0.05)}</td><td>${inp(`segments.${i}.upu.${j}`, r.s.upu[j], 1)}</td>`).join('')}
            <td class="r num">${CIE.money(r.base.pool)}</td><td><input type="checkbox" data-exp="${i}" ${r.s.expansion ? 'checked' : ''}></td><td><button class="btn sm danger" data-del="${i}">✕</button></td></tr>`).join('')}</tbody></table></div></div>
        <div class="card" style="margin-top:16px"><div class="card-head"><h3>Sales-capacity model</h3><span class="sub">can the team actually reach the market?</span></div>
          <div class="row">${[['reps', 'Account executives', 1], ['rampMonths', 'Ramp (months)', 1], ['dealsPerRep', 'Deals / ramped rep / yr', 1], ['acv', 'Average contract value ($)', 1000], ['expansion', 'Net revenue retention (×)', 0.05]].map(([k, l, s]) => `<label class="field">${l}${inp('capacity.' + k, cap[k], s)}</label>`).join('')}</div>
          <div class="grid g2" style="margin-top:12px"><div>${CIE.charts.columns(yr.map((r) => ({ label: 'Year ' + r.y, values: [r.newArr, r.book] })), [{ label: 'New ARR booked', color: 'var(--s1)' }, { label: 'Ending ARR book', color: 'var(--s3)' }], { title: 'Capacity ARR by year' })}</div>
          <div><p class="ink2">Year 3 book of <b>${CIE.money(yr[2].book)}</b> is ${CIE.pct(yr[2].book / (calc.base.pool || 1), 1)} of the Base pool. If that share looks implausibly high, the constraint is market access, not capacity; if low, it is selling capacity.</p></div></div></div>`;

      const setPath = (path, val) => {
        const ks = path.split('.');
        let o = m;
        for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]];
        o[ks[ks.length - 1]] = val;
      };
      root.querySelectorAll('[data-p]').forEach((el) => (el.onchange = () => { setPath(el.dataset.p, el.type === 'number' ? Number(el.value) : el.value); ctx.save(); ctx.rerender(); }));
      root.querySelectorAll('[data-exp]').forEach((el) => (el.onchange = () => { m.segments[el.dataset.exp].expansion = el.checked; ctx.save(); ctx.rerender(); }));
      root.querySelectorAll('[data-del]').forEach((el) => (el.onclick = () => { m.segments.splice(el.dataset.del, 1); ctx.save('Segment removed'); ctx.rerender(); }));
      root.querySelector('#addSeg').onclick = () => { m.segments.push({ name: 'New segment', count: 100, retain: [0.5, 0.7, 0.9], fit: [0.3, 0.5, 0.7], upu: [5, 15, 30], expansion: false }); ctx.save(); ctx.rerender(); };
    },
  });
})();

</script>

/* Buyer economics: per-account value streams, year-1 / steady-state / 3-year view, pricing scenarios. */
(function () {
  'use strict';
  const CIE = window.CIE, esc = CIE.esc;
  const view = { id: '' };

  CIE.registerModule({
    id: 'economics',
    group: 'market',
    title: 'Buyer economics',
    order: 21,
    describe: 'What the buyer gets for each dollar: value streams, 3-year economics and price scenarios.',
    render(root, ctx) {
      const ws = ctx.ws;
      const e = ws.economics || (ws.economics = { implementation: 0.25, screen: 3, streams: [], prices: [] });
      const ranked = CIE.rank(ws, null);
      if (!view.id || !CIE.findAccount(ws, view.id)) view.id = ranked[0] ? ranked[0].a.id : '';
      const a = CIE.findAccount(ws, view.id);
      if (!a) { root.innerHTML = '<div class="card">Add an account first.</div>'; return; }
      const units = Number(a.value.users) || 0;
      const price = Number(a.value.price) || ws.offering.price;
      const streams = e.streams.map((s) => ({ ...s, total: units * (Number(s.perUnit) || 0) * (Number(s.share) || 0) }));
      const counted = streams.filter((s) => s.counted).reduce((t, s) => t + s.total, 0);
      const notCounted = streams.filter((s) => !s.counted).reduce((t, s) => t + s.total, 0);
      const fee = units * price;
      const y1Cost = fee * (1 + e.implementation);
      const rows = [
        ['Year 1', counted, y1Cost],
        ['Year 2 steady state', counted, fee],
        ['3-year cumulative', counted * 3, fee * 3 + fee * e.implementation],
      ];
      const prices = (e.prices.length ? e.prices : [price * 0.6, price * 0.8, price, price * 1.25]).map(Number);
      const mix = streams.map((s, i) => ({ label: s.label + (s.counted ? '' : ' (not counted)'), value: s.total, color: s.counted ? CIE.SERIES[i % 8] : 'var(--muted)' })).concat([{ label: 'Total counted value', value: counted, color: 'var(--ink)' }, { label: 'Your fee', value: fee, color: 'var(--s7)' }]);

      root.innerHTML = `
        <div class="page-head"><div><h2>Buyer economics</h2><p>Value streams are per ${esc(ws.offering.unit)} per year, discounted by the share the buyer's finance team will actually count. Streams marked “not counted” are shown but never enter the return.</p></div>
          <label class="field">Account<select id="acc">${ranked.map((r) => `<option value="${esc(r.a.id)}" ${r.a.id === a.id ? 'selected' : ''}>${esc(r.a.name)} · fit ${r.s.fit}</option>`).join('')}</select></label></div>
        <div class="grid g4">
          <div class="card kpi"><div class="label">${esc(ws.offering.unit)}s in scope</div><div class="value">${CIE.num(units)}</div><div class="foot">from the account's value inputs</div></div>
          <div class="card kpi"><div class="label">Annual counted value</div><div class="value">${CIE.money(counted)}</div><div class="foot">+ ${CIE.money(notCounted)} shown, not counted</div></div>
          <div class="card kpi"><div class="label">Annual fee</div><div class="value">${CIE.money(fee)}</div><div class="foot">${CIE.money(price)} per ${esc(ws.offering.unit)}</div></div>
          <div class="card kpi"><div class="label">Steady-state return</div><div class="value">${(counted / (fee || 1)).toFixed(2)}×</div><div class="foot">screen: ${e.screen}× · <span class="status ${counted / (fee || 1) >= e.screen ? 'good' : 'serious'}">${counted / (fee || 1) >= e.screen ? 'passes' : 'below screen'}</span></div></div>
        </div>
        <div class="grid g2" style="margin-top:16px">
          <div class="card"><div class="card-head"><h3>Value mix</h3><span class="sub">annual, this account</span></div>${CIE.charts.barList(mix, { format: CIE.money, labelWidth: 210, title: 'Value mix' })}</div>
          <div class="card"><div class="card-head"><h3>Three-year buyer economics</h3><span class="sub">implementation ${CIE.pct(e.implementation)} of year-1 fee</span></div>
            <div class="table-wrap"><table><thead><tr><th>Period</th><th class="r">Value</th><th class="r">Cost</th><th class="r">Net</th><th class="r">Return</th></tr></thead>

            <div class="row" style="margin-top:10px"><label class="field">Implementation (share of fee)<input type="number" step="0.05" data-e="implementation" value="${e.implementation}"></label><label class="field">Return screen (×)<input type="number" step="0.5" data-e="screen" value="${e.screen}"></label></div></div>

        <div class="card" style="margin-top:16px"><div class="card-head"><h3>Pricing scenarios</h3><span class="sub">the bold row is the account's current price</span></div>

          <tbody>${prices.map((p) => { const f = units * p, kept = counted - f, three = (counted * 3) / (f * 3 + f * e.implementation || 1), pay = (f * (1 + e.implementation)) / (counted || 1) * 12;
            return `<tr ${Math.abs(p - price) < 0.5 ? 'style="font-weight:700"' : ''}><td class="r num">${CIE.money(p)}</td><td class="r num">${CIE.money(f)}</td><td class="r num">${CIE.money(counted)}</td><td class="r num">${(counted / (f || 1)).toFixed(2)}×</td><td class="r num">${CIE.money(kept)}</td><td class="r num">${CIE.pct(f / (counted || 1))}</td><td class="r num">${three.toFixed(2)}×</td><td class="r num">${counted ? pay.toFixed(1) + ' mo' : '—'}</td></tr>`; }).join('')}</tbody></table></div>
          <label class="field" style="margin-top:10px">Price points (comma-separated)<input id="prices" value="${esc(e.prices.join(', '))}" placeholder="Leave blank for 60% / 80% / 100% / 125% of current price"></label></div>
        <div class="card" style="margin-top:16px"><div class="card-head"><h3>Value streams</h3><span class="sub">shared by every account in this engagement</span><button class="btn sm" id="addStream">+ Add stream</button></div>
          <div class="table-wrap"><table><thead><tr><th>Stream</th><th class="r">$ / ${esc(ws.offering.unit)} / yr</th><th class="r">Share counted</th><th>In return?</th><th>Basis</th><th></th></tr></thead>
          <tbody>${e.streams.map((s, i) => `<tr><td><input data-s="${i}" data-k="label" value="${esc(s.label)}"></td><td><input type="number" data-s="${i}" data-k="perUnit" value="${s.perUnit}"></td><td><input type="number" step="0.05" data-s="${i}" data-k="share" value="${s.share}"></td><td><input type="checkbox" data-s="${i}" data-k="counted" ${s.counted ? 'checked' : ''}></td><td><input data-s="${i}" data-k="basis" value="${esc(s.basis || '')}"></td><td><button class="btn sm danger" data-del="${i}">✕</button></td></tr>`).join('')}</tbody></table></div></div>`;

      root.querySelector('#acc').onchange = (ev) => { view.id = ev.target.value; ctx.rerender(); };
      root.querySelectorAll('[data-e]').forEach((el) => (el.onchange = () => { e[el.dataset.e] = Number(el.value); ctx.save(); ctx.rerender(); }));
      root.querySelector('#prices').onchange = (ev) => { e.prices = ev.target.value.split(',').map((x) => Number(x.trim())).filter((x) => x > 0); ctx.save(); ctx.rerender(); };
      root.querySelectorAll('[data-s]').forEach((el) => (el.onchange = () => { const s = e.streams[el.dataset.s]; s[el.dataset.k] = el.type === 'checkbox' ? el.checked : el.type === 'number' ? Number(el.value) : el.value; ctx.save(); ctx.rerender(); }));
      root.querySelectorAll('[data-del]').forEach((el) => (el.onclick = () => { e.streams.splice(el.dataset.del, 1); ctx.save(); ctx.rerender(); }));
      root.querySelector('#addStream').onclick = () => { e.streams.push({ label: 'New value stream', perUnit: 1000, share: 0.5, counted: true, basis: '' }); ctx.save(); ctx.rerender(); };
    },
  });
})();

  <script>/* js/modules/revenue.js */
/* Operating truth (stamped inputs, unknowns never zero-filled) and the illustrative ARR bridge. */
(function () {
  'use strict';
  const CIE = window.CIE, esc = CIE.esc;

  CIE.registerModule({
    id: 'truth',
    group: 'market',
    title: 'Operating truth',
    order: 22,
    describe: 'Interview worksheet: every number stamped claim / testimony / preference / unknown.',
    render(root, ctx) {
      const ws = ctx.ws, t = ws.truth;
      root.innerHTML = `
        <div class="page-head"><div><h2>Operating truth</h2><p>What must be true before the growth story. Stamp every number. Unknowns render as hatched bars and never enter totals as zero. This is a prep worksheet, not finance or management guidance.</p></div>
          <div class="row"><button class="btn" id="addGroup">+ Add group</button></div></div>
        <div class="legend" style="margin:0 0 14px">${CIE.STAMPS.map((s) => `<span><span class="stamp stamp-${s}">${s}</span></span>`).join('')}</div>
        <div class="grid g3">${t.groups.map((g, gi) => {
          const known = g.fields.filter((f) => f.stamp !== 'unknown' && f.value !== '' && f.value != null);
          const max = Math.max(1, ...known.map((f) => Math.abs(Number(f.value) || 0)));
          return `<div class="card"><div class="card-head"><input data-g="${gi}" data-k="title" value="${esc(g.title)}" style="font-weight:600;border:0;padding:0;background:none;font-size:15px"><button class="btn sm" data-addf="${gi}">+ field</button></div>
            ${g.note ? `<p class="small muted">${esc(g.note)}</p>` : ''}
            ${g.fields.map((f, fi) => { const unk = f.stamp === 'unknown' || f.value === '' || f.value == null; const w = unk ? 100 : (Math.abs(Number(f.value) || 0) / max) * 100;
              return `<div class="truth-row"><input data-g="${gi}" data-f="${fi}" data-k="label" value="${esc(f.label)}" style="grid-column:1/-1;border:0;padding:2px 0;background:none;font-weight:500">
                <input data-g="${gi}" data-f="${fi}" data-k="value" value="${esc(f.value == null ? '' : f.value)}" placeholder="blank = unknown">
                <select data-g="${gi}" data-f="${fi}" data-k="stamp" class="stamp stamp-${f.stamp}">${CIE.STAMPS.map((s) => `<option ${s === f.stamp ? 'selected' : ''}>${s}</option>`).join('')}</select><div style="grid-column:1/-1"><div class="truth-bar ${unk ? 'hatch' : ''}" style="width:${w}%;${unk ? 'background-color:transparent' : ''}" data-tip="${unk ? 'Unknown — not counted' : esc(f.label + ': ' + f.value + ' (' + f.stamp + ')')}"></div></div></div>`; }).join('')}

        <div class="card" style="margin-top:16px"><div class="card-head"><h3>What I will ask in the room</h3><button class="btn sm" id="addQ">+ question</button></div>
          ${t.questions.map((q, i) => `<div class="row" style="margin-bottom:6px;flex-wrap:nowrap"><span class="muted num">${i + 1}.</span><input data-q="${i}" value="${esc(q)}" style="flex:1"><button class="btn sm danger" data-delq="${i}">✕</button></div>`).join('')}</div>`;
      root.querySelectorAll('[data-g]').forEach((el) => (el.onchange = () => {
        const g = t.groups[el.dataset.g];
        if (el.dataset.f == null) g[el.dataset.k] = el.value;
        else {

          f[el.dataset.k] = el.value;
          if (el.dataset.k === 'value' && el.value === '') f.stamp = 'unknown';
          if (el.dataset.k === 'value' && el.value !== '' && f.stamp === 'unknown') f.stamp = 'claim';

      root.querySelectorAll('[data-addf]').forEach((b) => (b.onclick = () => { t.groups[b.dataset.addf].fields.push({ label: 'New field', value: '', stamp: 'unknown' }); ctx.save(); ctx.rerender(); }));

  CIE.registerModule({
    id: 'bridge',
    group: 'market',
    title: 'Revenue bridge',
    order: 23,
    describe: 'Illustrative ARR bridge: expansion vs net-new vs churn, all editable.',
    render(root, ctx) {
      const ws = ctx.ws, b = ws.bridge;
      const steps = b.steps.map((s) => ({ label: s.label, value: (s.sign < 0 ? -1 : 1) * (Number(s.count) || 0) * (Number(s.avg) || 0) }));
      const end = (Number(b.start) || 0) + steps.reduce((t, s) => t + s.value, 0);
      const growth = steps.filter((s) => s.value > 0).reduce((t, s) => t + s.value, 0);
      const exp = b.steps.map((s, i) => ({ s, v: steps[i].value })).filter((x) => x.s.kind === 'expansion').reduce((t, x) => t + x.v, 0);
      root.innerHTML = `
        <div class="page-head"><div><h2>Revenue bridge</h2><p>Pressure-test the mix of installed-base expansion and net-new growth needed to reach the target. Every input is editable; none is management guidance.</p></div>
          <div class="row"><label class="field">Starting ARR ($)<input type="number" id="start" value="${b.start}"></label><label class="field">Target ARR ($)<input type="number" id="target" value="${b.target || 0}"></label></div></div>
        <div class="grid g4">
          <div class="card kpi"><div class="label">Starting ARR</div><div class="value">${CIE.money(b.start)}</div></div>
          <div class="card kpi"><div class="label">Ending ARR</div><div class="value">${CIE.money(end)}</div><div class="foot">${b.target ? (end >= b.target ? '<span class="status good">meets</span>' : '<span class="status serious">short of</span>') + ' target ' + CIE.money(b.target) : ''}</div></div>
          <div class="card kpi"><div class="label">Gross new ARR</div><div class="value">${CIE.money(growth)}</div></div>
          <div class="card kpi"><div class="label">Share from installed base</div><div class="value">${CIE.pct(exp / (growth || 1))}</div><div class="foot">steps tagged “expansion”</div></div>
        </div>
        <div class="card" style="margin-top:16px">${CIE.charts.waterfall(Number(b.start) || 0, steps, { startLabel: 'Starting ARR', endLabel: 'Ending ARR', title: 'ARR bridge' })}</div>
        <div class="card" style="margin-top:16px"><div class="card-head"><h3>Bridge steps</h3><button class="btn sm" id="add">+ step</button></div>
          <div class="table-wrap"><table><thead><tr><th>Step</th><th>Kind</th><th class="r">Count</th><th class="r">Average ARR ($)</th><th>Direction</th><th class="r">Impact</th><th></th></tr></thead>
          <tbody>${b.steps.map((s, i) => `<tr><td><input data-i="${i}" data-k="label" value="${esc(s.label)}"></td>
            <td><select data-i="${i}" data-k="kind">${['expansion', 'new', 'churn', 'other'].map((k) => `<option ${k === s.kind ? 'selected' : ''}>${k}</option>`).join('')}</select></td>
            <td><input type="number" data-i="${i}" data-k="count" value="${s.count}"></td><td><input type="number" data-i="${i}" data-k="avg" value="${s.avg}"></td>
            <td><select data-i="${i}" data-k="sign"><option value="1" ${s.sign >= 0 ? 'selected' : ''}>adds</option><option value="-1" ${s.sign < 0 ? 'selected' : ''}>subtracts</option></select></td>
            <td class="r num">${CIE.money(steps[i].value)}</td><td><button class="btn sm danger" data-del="${i}">✕</button></td></tr>`).join('')}</tbody></table></div></div>`;
      root.querySelector('#start').onchange = (e) => { b.start = Number(e.target.value); ctx.save(); ctx.rerender(); };
      root.querySelector('#target').onchange = (e) => { b.target = Number(e.target.value); ctx.save(); ctx.rerender(); };
      root.querySelectorAll('[data-i]').forEach((el) => (el.onchange = () => { const s = b.steps[el.dataset.i]; const k = el.dataset.k; s[k] = ['count', 'avg', 'sign'].includes(k) ? Number(el.value) : el.value; ctx.save(); ctx.rerender(); }));
      root.querySelectorAll('[data-del]').forEach((el) => (el.onclick = () => { b.steps.splice(el.dataset.del, 1); ctx.save(); ctx.rerender(); }));
      root.querySelector('#add').onclick = () => { b.steps.push({ label: 'New step', kind: 'new', count: 1, avg: 50000, sign: 1 }); ctx.save(); ctx.rerender(); };
    },
  });
})();

</script>
  <script>/* js/modules/pilot.js */
/* Pilot & gates (gate tracker, cohort builder, value types never added together)
   and Deal mechanics (MEDDPICC evidence per account). */
(function () {
  'use strict';
  const CIE = window.CIE, esc = CIE.esc;
  const GATE_STATUS = [
    { id: 'not_started', label: 'Not started', cls: '' },
    { id: 'in_progress', label: 'In progress', cls: 'warning' },
    { id: 'passed', label: 'Passed', cls: 'good' },
    { id: 'failed', label: 'Failed / redesign', cls: 'critical' },
  ];
  const ROLES = ['Strong fit', 'Typical', 'Friction case'];

  CIE.registerModule({
    id: 'gates',
    group: 'pilot',
    title: 'Gates & pilot cohort',
    order: 30,
    describe: 'Evidence gates before rollout, a balanced pilot cohort, and value types kept separate.',
    render(root, ctx) {
      const ws = ctx.ws, G = ws.gates;
      G.valueTypes = G.valueTypes || [];
      const ranked = CIE.rank(ws, null);
      const cohort = G.cohort.map((c) => ({ c, r: ranked.find((r) => r.a.id === c.id) })).filter((x) => x.r);
      const passed = G.gates.filter((g) => g.status === 'passed').length;

      root.innerHTML = `
        <div class="page-head"><div><h2>Gates & pilot cohort</h2><p>No rollout past a gate until its owner signs off. A “no-go” on a weak use case counts as progress.</p></div>
          <div class="row"><button class="btn" id="addGate">+ Add gate</button></div></div>
        ${G.oneLine ? `<div class="card" style="margin-bottom:16px"><div class="card-head"><h3>The strategy in one line</h3></div><p style="font-size:15px;margin:0">${esc(G.oneLine)}</p></div>` : ''}
        <div class="card"><div class="card-head"><h3>The gates</h3><span class="sub">${passed} of ${G.gates.length} passed</span></div>
          ${CIE.charts.stackBar(GATE_STATUS.map((s, i) => ({ label: s.label, value: G.gates.filter((g) => g.status === s.id).length, color: ['var(--axis)', 'var(--warning)', 'var(--good)', 'var(--critical)'][i] })).filter((p) => p.value), { title: 'Gate status' })}
          <div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>#</th><th>Gate</th><th>Pass criteria</th><th>Owner</th><th>Status</th><th></th></tr></thead>
          <tbody>${G.gates.map((g, i) => `<tr><td class="num">${i}</td><td><input data-g="${i}" data-k="name" value="${esc(g.name)}"></td><td><input data-g="${i}" data-k="criteria" value="${esc(g.criteria)}" style="min-width:260px"></td><td><input data-g="${i}" data-k="owner" value="${esc(g.owner || '')}"></td>
            <td><select data-g="${i}" data-k="status">${GATE_STATUS.map((s) => `<option value="${s.id}" ${s.id === g.status ? 'selected' : ''}>${s.label}</option>`).join('')}</select></td><td><button class="btn sm danger" data-delg="${i}">✕</button></td></tr>`).join('')}</tbody></table></div>
          ${G.stopRules ? `<p class="notice" style="margin-top:12px"><b>Stop or redesign when:</b> ${esc(G.stopRules)}</p>` : ''}</div>

        <div class="grid g2" style="margin-top:16px">
          <div class="card"><div class="card-head"><h3>Build the pilot cohort</h3><span class="sub">one strong, one typical, one with friction</span></div>
            <div class="row" style="margin-bottom:10px"><button class="btn primary" id="suggest">Suggest a starting cohort</button><button class="btn" id="clear">Clear</button>
              <select id="addAcc"><option value="">+ Add an account…</option>${ranked.filter((r) => !G.cohort.find((c) => c.id === r.a.id)).map((r) => `<option value="${esc(r.a.id)}">${esc(r.a.name)}</option>`).join('')}</select></div>
            <div class="table-wrap"><table><thead><tr><th>Account</th><th>Role</th><th>Fit</th><th></th></tr></thead><tbody>
            ${cohort.map(({ c, r }, i) => `<tr><td class="clickable" data-open="${esc(r.a.id)}"><b>${esc(r.a.name)}</b><div class="small muted">${esc(CIE.segmentName(ws, r.a.segment))} · ${esc(r.a.state)}</div></td>
              <td><select data-role="${i}">${ROLES.map((x) => `<option ${x === c.role ? 'selected' : ''}>${x}</option>`).join('')}</select></td><td>${CIE.fitBar(r.s.fit, r.s.completeness)}</td><td><button class="btn sm danger" data-delc="${i}">✕</button></td></tr>`).join('') || '<tr><td colspan="4" class="muted">No cohort yet. “Suggest” picks a top account, a median account and a lower-fit one with a relationship path.</td></tr>'}
            </tbody></table></div></div>
          <div class="card"><div class="card-head"><h3>Value types — never add these together</h3><button class="btn sm" id="addVT">+ type</button></div>
            ${G.valueTypes.map((v, i) => `<div class="card" style="padding:10px;margin-bottom:8px;box-shadow:none"><div class="row" style="justify-content:space-between"><input data-v="${i}" data-k="label" value="${esc(v.label)}" style="font-weight:600;flex:1"><button class="btn sm danger" data-delv="${i}">✕</button></div>
              <div class="row" style="margin-top:6px">${['low', 'base', 'high'].map((k) => `<label class="field">${k === 'low' ? 'Downside' : k === 'base' ? 'Working' : 'Upside'} ($)<input type="number" data-v="${i}" data-k="${k}" value="${v[k] || 0}"></label>`).join('')}</div>
              <input data-v="${i}" data-k="note" value="${esc(v.note || '')}" placeholder="What kind of value this is" style="width:100%;margin-top:6px"></div>`).join('')}
            ${G.valueTypes.length ? CIE.charts.columns(G.valueTypes.map((v) => ({ label: v.label.length > 16 ? v.label.slice(0, 15) + '…' : v.label, values: [v.low || 0, v.base || 0, v.high || 0] })), [{ label: 'Downside', color: 'var(--s2)' }, { label: 'Working', color: 'var(--s1)' }, { label: 'Upside', color: 'var(--s3)' }], { title: 'Value types', height: 180 }) : ''}
            <p class="small muted">Preventing a loss, growing volume, and collecting cash sooner are different money. Cash timing is one-time, not profit. They are shown side by side, deliberately without a total.</p></div>
        </div>`;

      root.querySelectorAll('[data-g]').forEach((el) => (el.onchange = () => { G.gates[el.dataset.g][el.dataset.k] = el.value; ctx.save(); ctx.rerender(); }));
      root.querySelectorAll('[data-delg]').forEach((el) => (el.onclick = () => { G.gates.splice(el.dataset.delg, 1); ctx.save(); ctx.rerender(); }));
      root.querySelector('#addGate').onclick = () => { G.gates.push({ name: 'New gate', criteria: '', owner: '', status: 'not_started' }); ctx.save(); ctx.rerender(); };
      root.querySelector('#suggest').onclick = () => {
        if (!ranked.length) return;
        const strong = ranked[0].a;
        const typical = ranked[Math.floor(ranked.length / 2)].a;
        const friction = ranked.slice(Math.floor(ranked.length / 2) + 1).find((r) => r.a.relationship.strength !== 'none') || ranked[ranked.length - 1];
        G.cohort = [{ id: strong.id, role: ROLES[0] }, { id: typical.id, role: ROLES[1] }, { id: (friction.a || friction).id, role: ROLES[2] }];
        ctx.save('Cohort suggested'); ctx.rerender();
      };
      root.querySelector('#clear').onclick = () => { G.cohort = []; ctx.save(); ctx.rerender(); };
      root.querySelector('#addAcc').onchange = (e) => { if (!e.target.value) return; G.cohort.push({ id: e.target.value, role: ROLES[1] }); ctx.save(); ctx.rerender(); };
      root.querySelectorAll('[data-role]').forEach((el) => (el.onchange = () => { G.cohort[el.dataset.role].role = el.value; ctx.save(); }));
      root.querySelectorAll('[data-delc]').forEach((el) => (el.onclick = () => { G.cohort.splice(el.dataset.delc, 1); ctx.save(); ctx.rerender(); }));
      root.querySelectorAll('[data-open]').forEach((el) => (el.onclick = () => CIE.openAccount(ctx, el.dataset.open)));
      root.querySelectorAll('[data-v]').forEach((el) => (el.onchange = () => { const v = G.valueTypes[el.dataset.v]; v[el.dataset.k] = el.type === 'number' ? Number(el.value) : el.value; ctx.save(); ctx.rerender(); }));
      root.querySelectorAll('[data-delv]').forEach((el) => (el.onclick = () => { G.valueTypes.splice(el.dataset.delv, 1); ctx.save(); ctx.rerender(); }));
      root.querySelector('#addVT').onclick = () => { G.valueTypes.push({ label: 'New value type', low: 0, base: 0, high: 0, note: '' }); ctx.save(); ctx.rerender(); };
    },
  });

  /* ---------------- Deal mechanics ---------------- */
  const MEDDPICC = [
    ['metrics', 'Metrics', 'The measurable outcome the buyer will hold you to'],
    ['economic_buyer', 'Economic buyer', 'The person who can say yes to the money'],
    ['decision_criteria', 'Decision criteria', 'How they will judge the options'],
    ['decision_process', 'Decision process', 'Steps, people and dates to a decision'],
    ['paper_process', 'Paper process', 'Legal, security, procurement and contracting path'],
    ['pain', 'Identified pain', 'The funded problem, in their words'],
    ['champion', 'Champion', 'Someone with power who sells for you when you are not there'],
    ['competition', 'Competition', 'Alternatives, including build-it-yourself and do nothing'],
  ];
  const EVS = [
    { id: 'unknown', label: 'Unknown', score: 0 },
    { id: 'claimed', label: 'Claimed by us', score: 0.3 },
    { id: 'partial', label: 'Partially confirmed', score: 0.6 },
    { id: 'confirmed', label: 'Confirmed by buyer', score: 1 },
  ];
  const dview = { id: '' };

  CIE.registerModule({
    id: 'deals',
    group: 'pilot',
    title: 'Deal mechanics',
    order: 31,
    describe: 'MEDDPICC evidence per account, with stalled-deal plays.',
    render(root, ctx) {
      const ws = ctx.ws;
      ws.deals = ws.deals || { byAccount: {}, plays: [] };
      const D = ws.deals;
      const ranked = CIE.rank(ws, null);
      const health = (id) => { const d = D.byAccount[id] || {}; return MEDDPICC.reduce((s, [k]) => s + (EVS.find((e) => e.id === ((d[k] || {}).status || 'unknown')).score), 0) / MEDDPICC.length; };
      const pipeline = ranked.filter((r) => ['research_ready', 'outreach_ready', 'qualified'].includes(r.a.stage) || D.byAccount[r.a.id]);

        </div>
        ${D.plays.length ? `<h3 style="margin:22px 0 10px">Unblock a stalled deal</h3><div class="grid g2">${D.plays.map((p) => `<div class="card"><h3 style="margin-bottom:6px">${esc(p.situation)}</h3><p class="small muted" style="margin-bottom:6px">Signal: ${esc(p.signal)}</p><p class="ink2" style="margin:0">${esc(p.move)}</p></div>`).join('')}</div>` : ''}`;

      root.querySelectorAll('#dh [data-id]').forEach((g) => (g.onclick = () => { dview.id = g.dataset.id; ctx.rerender(); }));

    },
  });
})();

(function () {
  'use strict';
  const CIE = window.CIE, esc = CIE.esc;
  const CONF = ['High', 'Medium-high', 'Medium', 'Medium-low', 'Low'];
  const kview = { q: '' };

  // A small editable-list renderer shared by the knowledge pages.
  function listEditor(root, ctx, arr, fields, opts) {
    const rows = arr.map((r, i) => ({ r, i })).filter(({ r }) => !kview.q || JSON.stringify(r).toLowerCase().includes(kview.q.toLowerCase()));
    root.insertAdjacentHTML('beforeend', `<div class="table-wrap"><table><thead><tr>${fields.map((f) => `<th>${esc(f.label)}</th>`).join('')}<th></th></tr></thead><tbody>
      ${rows.map(({ r, i }) => `<tr>${fields.map((f) => `<td>${f.options ? `<select data-i="${i}" data-k="${f.key}">${f.options.map((o) => `<option ${o === r[f.key] ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>` : f.long ? `<textarea data-i="${i}" data-k="${f.key}" style="min-width:${f.width || 200}px;min-height:56px">${esc(r[f.key] || '')}</textarea>` : `<input data-i="${i}" data-k="${f.key}" value="${esc(r[f.key] || '')}" style="min-width:${f.width || 120}px">`}${f.link && r[f.key] && /^https?:/.test(r[f.key]) ? ` <a href="${esc(r[f.key])}" target="_blank" rel="noopener" class="small">open</a>` : ''}</td>`).join('')}<td><button class="btn sm danger" data-del="${i}">✕</button></td></tr>`).join('') || `<tr><td colspan="${fields.length + 1}" class="muted">Nothing here yet.</td></tr>`}
      </tbody></table></div>`);
    root.querySelectorAll('[data-i]').forEach((el) => (el.onchange = () => { arr[el.dataset.i][el.dataset.k] = el.value; ctx.save(); }));
    root.querySelectorAll('[data-del]').forEach((el) => (el.onclick = () => { arr.splice(el.dataset.del, 1); ctx.save(); ctx.rerender(); }));
    const add = root.querySelector('#add');
    if (add) add.onclick = () => { arr.unshift(opts.blank()); ctx.save(); ctx.rerender(); };
    const q = root.querySelector('#kq');
    if (q) q.oninput = () => { kview.q = q.value; clearTimeout(q._t); q._t = setTimeout(() => { ctx.rerender(); const n = document.getElementById('kq'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 250); };
  }
  const head = (title, desc, n) => `<div class="page-head"><div><h2>${title}</h2><p>${desc}</p></div><div class="row"><input id="kq" placeholder="Search…" value="${esc(kview.q)}"><button class="btn" id="add">+ Add</button><span class="muted small">${n} items</span></div></div>`;

  CIE.registerModule({
    id: 'decisions', group: 'knowledge', title: 'Decision log', order: 40,
    describe: 'The calls made, the reason, the confidence, what each changed — and your note.',
    render(root, ctx) {
      const ws = ctx.ws;
      const counts = CONF.map((c) => ({ label: c, value: ws.decisions.filter((d) => d.confidence === c).length, color: 'var(--s1)' }));
      root.innerHTML = head('Decision log', 'Each call shows the reason, the confidence and what it changed in the model. Overrule any of them in “Your note” and set the status.', ws.decisions.length) +
        `<div class="card" style="margin-bottom:16px"><div class="card-head"><h3>Confidence of the calls</h3></div>${CIE.charts.barList(counts, { labelWidth: 120, row: 20, title: 'Decisions by confidence' })}</div>`;
      listEditor(root, ctx, ws.decisions, [
        { key: 'topic', label: 'Topic', width: 110 }, { key: 'question', label: 'Question', long: true, width: 200 }, { key: 'call', label: 'The call', long: true, width: 240 },
        { key: 'why', label: 'Why', long: true, width: 220 }, { key: 'confidence', label: 'Confidence', options: CONF }, { key: 'effect', label: 'What it changed', long: true, width: 160 },
        { key: 'status', label: 'Status', options: ['Open', 'Accepted', 'Changed'] }, { key: 'mine', label: 'Your note', long: true, width: 180 },
      ], { blank: () => ({ topic: '', question: '', call: '', why: '', confidence: 'Medium', effect: '', status: 'Open', mine: '' }) });
    },
  });

  CIE.registerModule({
    id: 'diligence', group: 'knowledge', title: 'Diligence queue', order: 41,
    describe: 'The questions that decide whether the plan is fundable and repeatable.',
    render(root, ctx) {
      const ws = ctx.ws;
      ws.diligence = ws.diligence || [];
      root.innerHTML = head('Diligence queue', 'Facts before promises. Each item names why it matters, who can answer it and where it stands.', ws.diligence.length);
      listEditor(root, ctx, ws.diligence, [
        { key: 'question', label: 'Question', long: true, width: 260 }, { key: 'why', label: 'Why it matters', long: true, width: 240 },
        { key: 'owner', label: 'Who can answer' }, { key: 'priority', label: 'Priority', options: ['P1', 'P2', 'P3'] },
        { key: 'status', label: 'Status', options: ['Open', 'Asked', 'Answered', 'Blocked'] }, { key: 'answer', label: 'Answer / evidence', long: true, width: 200 },
      ], { blank: () => ({ question: '', why: '', owner: '', priority: 'P2', status: 'Open', answer: '' }) });
    },
  });

  CIE.registerModule({
    id: 'sources', group: 'knowledge', title: 'Sources', order: 42,
    describe: 'Source register: every source dated, with what it supports.',
    render(root, ctx) {
      const ws = ctx.ws;
      root.innerHTML = head('Sources', 'Every source dated. Mark how far each can be trusted: public record, customer testimony, vendor claim, or our assumption.', ws.sources.length);
      listEditor(root, ctx, ws.sources, [
        { key: 'title', label: 'Source', width: 200 }, { key: 'publisher', label: 'Publisher' }, { key: 'date', label: 'Date', width: 96 },
        { key: 'kind', label: 'Kind', options: ['Public record', 'Research', 'Customer testimony', 'Vendor claim', 'Interview', 'Assumption'] },
        { key: 'supports', label: 'What it supports', long: true, width: 220 }, { key: 'url', label: 'Link', width: 180, link: true },
      ], { blank: () => ({ title: '', publisher: '', date: new Date().toISOString().slice(0, 10), kind: 'Public record', supports: '', url: '' }) });
    },
  });

  CIE.registerModule({
    id: 'glossary', group: 'knowledge', title: 'Glossary', order: 43,
    describe: 'Every abbreviation spelled out, with why it matters commercially.',
    render(root, ctx) {
      const ws = ctx.ws;
      ws.glossary.sort((a, b) => (a.term || '').localeCompare(b.term || ''));
      root.innerHTML = head('Glossary', 'Every abbreviation spelled out in full, defined in plain English, with its commercial relevance.', ws.glossary.length);
      listEditor(root, ctx, ws.glossary, [
        { key: 'term', label: 'Term', width: 90 }, { key: 'full', label: 'Full name', width: 200 }, { key: 'definition', label: 'Plain-English definition', long: true, width: 280 }, { key: 'relevance', label: 'Why it matters', long: true, width: 220 },
      ], { blank: () => ({ term: '', full: '', definition: '', relevance: '' }) });
    },
  });
})();

            <h3 style="margin:18px 0 8px">Save & export</h3>

            <h3 style="margin:18px 0 8px">Import an existing CIE file</h3>
            <p class="small ink2">Pick one of your original single-file CIEs (.html). Its accounts, scores, sources, glossary, decisions and any facility infection (HAI) table become a new engagement. The file is read in this browser only — nothing is uploaded, and its scripts are not run.</p>
            <label class="btn primary">Choose a CIE .html file…<input type="file" id="impHtml" accept=".html,.htm,text/html" hidden></label>
            <p class="small muted" style="margin-top:8px">Recognised layouts: ${CIE.importers.map((a) => esc(a.label)).join(' · ')}.</p>
            <p class="small muted" style="margin-top:8px">Import adds the file as a new engagement; it never overwrites one you have. Browser storage is per browser and per file location — clearing site data erases it, so export after each working session.</p></div>

        <div class="card" style="margin-top:16px"><div class="card-head"><h3>Modules</h3><span class="sub">turn tabs on or off for this engagement · add your own</span></div>

            ${all.filter((m) => m.group === g.id).map((m) => `<label class="check" style="align-items:flex-start"><input type="checkbox" data-mod="${esc(m.id)}" ${enabled(m.id) ? 'checked' : ''}><span><b>${esc(m.title)}</b><div class="small muted">${esc(m.describe || '')}</div></span></label>`).join('')}</div>`).join('')}

            <button class="btn" id="addMod" style="margin-top:8px">+ Add a module</button></div></div></div>

        <div class="grid g2" style="margin-top:16px">

            ${ws.segments.length > 8 ? '<p class="small muted">Segments past the eighth share a neutral colour. Fold small ones together.</p>' : ''}</div>
          <div class="card"><div class="card-head"><h3>Lenses</h3><span class="sub">one-click views on Target accounts</span><button class="btn sm" id="addLens">+ Lens</button></div>
            ${ws.lenses.map((l, i) => `<div class="card" style="padding:10px;margin-bottom:8px;box-shadow:none"><div class="row" style="flex-wrap:nowrap"><input data-lens="${i}" data-k="label" value="${esc(l.label)}" style="flex:1;font-weight:600">${l.id !== 'all' ? `<button class="btn sm danger" data-dellens="${i}">✕</button>` : ''}</div>
              ${l.id !== 'all' ? `<div class="row" style="margin-top:6px"><label class="field" style="flex:1">Segments<select multiple data-lens="${i}" data-k="segments" style="min-height:60px">${ws.segments.map((s) => `<option value="${esc(s.id)}" ${(l.filter.segments || []).includes(s.id) ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></label>

                ${Q ? `<li>${Q.rows.length.toLocaleString()} facilities with ${Q.measures.length} infection measures — open <b>Facility quality (HAI)</b></li>` : ''}
                <li>${w.sources.length} sources · ${w.glossary.length} glossary terms · ${w.decisions.length} decisions · ${(w.diligence || []).length} diligence items</li></ul>
                <p class="small muted">Review the scoring dimensions in the Scoring workbench — imported scores keep their original evidence status where the file recorded one.</p>`, Q ? [{ label: 'Open HAI data', primary: true, run() { ctx.go('quality'); } }] : []);
            } catch (err) { CIE.modal('Could not import', `<p>${esc(err.message)}</p>`); }
          }, 30);
        };
        rd.readAsText(f);
      };
      root.querySelector('#expAcc').onclick = () => {
        const rows = CIE.rank(ws, null);
        CIE.download(CIE.slug(ws.name) + '-accounts.csv', CIE.toCSV(rows, [{ label: 'Account', get: (r) => r.a.name }, { label: 'Segment', get: (r) => CIE.segmentName(ws, r.a.segment) }, { label: 'State', get: (r) => r.a.state }, { label: 'Fit', get: (r) => r.s.fit }, { label: 'Evidence share', get: (r) => Math.round(r.s.completeness * 100) + '%' }, { label: 'Stage', get: (r) => CIE.stageLabel(r.a.stage) }, { label: 'Users', get: (r) => r.a.value.users }, { label: 'Notes', get: (r) => r.a.notes }]), 'text/csv');
      };
      // modules
      root.querySelectorAll('[data-mod]').forEach((el) => (el.onchange = () => {
        const ids = ws.enabledModules || all.map((m) => m.id);
        ws.enabledModules = el.checked ? [...new Set(ids.concat(el.dataset.mod))] : ids.filter((x) => x !== el.dataset.mod);
        ctx.save(el.checked ? 'Module on' : 'Module off');
      }));
      root.querySelector('#addMod').onclick = () => {
        CIE.modal('Add a module', `<p class="ink2">A module is a new tab with its own editable table, saved and exported with this engagement. Start from a template or a blank table.</p>
          <label class="field">Template<select id="tpl">${MODULE_TEMPLATES.map((t, i) => `<option value="${i}">${esc(t.title)}</option>`).join('')}</select></label>
          <label class="field" style="margin-top:8px">Tab name<input id="tt" placeholder="Defaults to the template name"></label>
          <label class="field" style="margin-top:8px">Columns (comma-separated)<input id="tc" placeholder="Defaults to the template's columns"></label>
          <p class="small muted" style="margin-top:8px">Need charts or calculations? Developers can add a full module as one JavaScript file — see README “Adding a module”.</p>`, [{ label: 'Add module', primary: true, run(m) {
          const t = MODULE_TEMPLATES[m.querySelector('#tpl').value];
          const cols = m.querySelector('#tc').value.split(',').map((x) => x.trim()).filter(Boolean);
          const c = { id: CIE.uid('mod'), title: m.querySelector('#tt').value.trim() || t.title, columns: cols.length ? cols : t.columns.slice(), rows: [] };
          ws.custom.push(c); ctx.save('Module added'); ctx.go('custom-' + c.id);
        } }]);
      };
      root.querySelectorAll('[data-editc]').forEach((b) => (b.onclick = () => {
        const c = ws.custom[b.dataset.editc];
        CIE.modal('Edit module', `<label class="field">Tab name<input id="tt" value="${esc(c.title)}"></label><label class="field" style="margin-top:8px">Columns (comma-separated — renaming keeps data by position)<input id="tc" value="${esc(c.columns.join(', '))}"></label>`, [{ label: 'Save', primary: true, run(m) {
          c.title = m.querySelector('#tt').value.trim() || c.title;
          const cols = m.querySelector('#tc').value.split(',').map((x) => x.trim()).filter(Boolean);
          if (cols.length) c.columns = cols;
          ctx.save('Module updated'); ctx.rerender();
        } }]);
      }));
      root.querySelectorAll('[data-delc]').forEach((b) => (b.onclick = () => {
        const c = ws.custom[b.dataset.delc];
        CIE.modal('Remove module?', `<p>Removes “${esc(c.title)}” and its ${c.rows.length} rows.</p>`, [{ label: 'Remove', run() { ws.custom.splice(b.dataset.delc, 1); ctx.save('Module removed'); ctx.rerender(); } }]);
      }));
      // segments
      root.querySelectorAll('[data-seg]').forEach((el) => (el.onchange = () => { ws.segments[el.dataset.seg].name = el.value; ctx.save(); }));
      root.querySelectorAll('[data-delseg]').forEach((el) => (el.onclick = () => { ws.segments.splice(el.dataset.delseg, 1); ctx.save(); ctx.rerender(); }));
      root.querySelector('#addSeg').onclick = () => { ws.segments.push({ id: CIE.uid('seg'), name: 'New segment' }); ctx.save(); ctx.rerender(); };
      // lenses
      root.querySelectorAll('[data-lens]').forEach((el) => (el.onchange = () => {
        const l = ws.lenses[el.dataset.lens], k = el.dataset.k;
        if (k === 'label') l.label = el.value;
        else if (k === 'access') l.access = el.checked;
        else if (k === 'segments') l.filter.segments = [...el.selectedOptions].map((o) => o.value);
        else if (k === 'tags') l.filter.tags = el.value.split(',').map((x) => x.trim()).filter(Boolean);
        ctx.save();
      }));
      root.querySelectorAll('[data-dellens]').forEach((el) => (el.onclick = () => { ws.lenses.splice(el.dataset.dellens, 1); ctx.save(); ctx.rerender(); }));
      root.querySelector('#addLens').onclick = () => { ws.lenses.push({ id: CIE.uid('lens'), label: 'New lens', filter: {} }); ctx.save(); ctx.rerender(); };
    },
  });
})();

</script>
  <!-- shell -->
  <script>/* js/app.js */
/* App shell: sidebar, routing, theme, workspace switching, drawer. Loaded after every module. */
(function () {
  'use strict';
  const CIE = window.CIE;
  const esc = CIE.esc;
  let ws = null;
  let current = null;

  async function boot() {
    // First run: seed the generic sample engagement.
    let list = CIE.listWorkspaces();
    if (!list.length && window.CIE_SAMPLE) {
      const s = CIE.normalize(CIE.clone(window.CIE_SAMPLE));
      s._dsDirty = true;
      CIE.saveWorkspace(s);
      list = CIE.listWorkspaces();
    }
    const id = CIE.prefs.workspace && list.find((w) => w.id === CIE.prefs.workspace) ? CIE.prefs.workspace : list[0] && list[0].id;
    ws = (id && (await CIE.loadWorkspace(id))) || CIE.normalize(CIE.clone(window.CIE_SAMPLE || CIE.blankWorkspace('Sample')));
    applyTheme();
    window.addEventListener('hashchange', route);
    route();
  }

  function applyTheme() {
    const t = CIE.prefs.theme;
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');
  }

  const ctx = (CIE.ctx = {
    get ws() { return ws; },
    // Call after changing ws.datasets so the large tables are rewritten too.
    saveDatasets(msg) { ws._dsDirty = true; this.save(msg); },
    save(msg) {
      const ok = CIE.saveWorkspace(ws);
      if (!ok) CIE.toast('Browser storage is unavailable — export to keep your edits');
      else if (msg) CIE.toast(msg);
      renderNav();
    },
    rerender() { renderPage(); },
    go(id) { location.hash = '#/' + id; },
    async switchWorkspace(id) {
      const next = await CIE.loadWorkspace(id);
      if (!next) return;
      ws = next;
      CIE.prefs.workspace = id;
      CIE.savePrefs();
      renderNav();
      renderPage();
    },
    replaceWorkspace(next) {
      ws = CIE.normalize(next);
      if (ws.datasets && Object.keys(ws.datasets).length) ws._dsDirty = true;
      CIE.saveWorkspace(ws);
      CIE.prefs.workspace = ws.id;
      CIE.savePrefs();
      renderNav();
      renderPage();
    },
    openDrawer(html, bind) {
      closeDrawer();
      const back = document.createElement('div');
      back.className = 'drawer-backdrop';
      const d = document.createElement('aside');
      d.className = 'drawer';
      d.innerHTML = `<div class="row" style="justify-content:flex-end;margin-bottom:6px"><button class="btn sm" data-close-drawer>Close ✕</button></div>${html}`;
      back.addEventListener('click', closeDrawer);
      d.addEventListener('click', (e) => { if (e.target.hasAttribute('data-close-drawer')) closeDrawer(); });
      document.body.append(back, d);
      if (bind) bind(d);
      return d;
    },
    closeDrawer,
  });
  function closeDrawer() { document.querySelectorAll('.drawer, .drawer-backdrop').forEach((n) => n.remove()); }
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeDrawer(); document.querySelectorAll('.modal-back').forEach((n) => n.remove()); } });

  function route() {
    const mods = CIE.activeModules(ws);
    const want = (location.hash.match(/^#\/([\w-]+)/) || [])[1];
    current = mods.find((m) => m.id === want) || mods[0];
    renderNav();
    renderPage();
  }

  function renderNav() {
    const mods = CIE.activeModules(ws);
    const list = CIE.listWorkspaces();
    const nav = document.getElementById('nav');
    nav.innerHTML =
      `<div class="brand"><div class="brand-mark">CIE</div><div><div class="brand-name">Commercial Intelligence</div><div class="brand-sub">Master engine · v${CIE.version}</div></div></div>
      <label class="field" style="margin:0 6px 14px">Engagement
        <select id="wsPick" class="ws-picker">${list.map((w) => `<option value="${esc(w.id)}" ${w.id === ws.id ? 'selected' : ''}>${esc(w.name)}</option>`).join('')}</select></label>` +
      CIE.groups
        .map((g) => {
          const items = mods.filter((m) => m.group === g.id);
          if (!items.length) return '';
          return `<div class="nav-group"><div class="nav-group-title">${esc(g.title)}</div>${items
            .map((m) => `<button class="nav-item ${current && m.id === current.id ? 'active' : ''}" data-go="${esc(m.id)}"><span class="dot"></span>${esc(m.title)}</button>`)
            .join('')}</div>`;
        })
        .join('');
    nav.querySelector('#wsPick').onchange = (e) => ctx.switchWorkspace(e.target.value);
    nav.querySelectorAll('[data-go]').forEach((b) => (b.onclick = () => { ctx.go(b.dataset.go); nav.classList.remove('open'); }));
  }

  function renderPage() {
    closeDrawer();
    const mods = CIE.activeModules(ws);
    if (!current || !mods.find((m) => m.id === current.id)) current = mods[0];
    document.getElementById('pageTitle').textContent = current.title;
    document.getElementById('wsLabel').textContent = [ws.company || ws.name, ws.asOf ? 'as of ' + ws.asOf : ''].filter(Boolean).join(' · ');
    document.title = (ws.company || ws.name) + ' · ' + current.title + ' · CIE';
    const root = document.getElementById('page');
    root.innerHTML = '';
    try {
      current.render(root, ctx);
    } catch (err) {
      root.innerHTML = `<div class="card"><h3>This module hit an error</h3><p class="muted">${esc(err.message)}</p><p class="small">Your data is safe. Export it from Workspace → Data &amp; modules.</p></div>`;
      console.error(err);
    }
    window.scrollTo(0, 0);
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('menuBtn').onclick = () => document.getElementById('nav').classList.toggle('open');
    document.getElementById('themeBtn').onclick = () => {
      const order = [undefined, 'light', 'dark'];
      CIE.prefs.theme = order[(order.indexOf(CIE.prefs.theme) + 1) % 3];
      CIE.savePrefs();
      applyTheme();
      CIE.toast('Theme: ' + (CIE.prefs.theme || 'match system'));
    };
    const fb = document.getElementById('fallback');
    if (fb) fb.remove();
    boot();
  });
})();

</script>
