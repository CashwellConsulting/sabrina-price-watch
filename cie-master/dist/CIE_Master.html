<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Commercial Intelligence Engine</title>
  <style>
/* CIE Master — one stylesheet, tokens first. Light/dark are separately stepped, not auto-flipped. */
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --surface-2: #f3f2ee;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --accent: #2a78d6;
  --accent-ink: #ffffff;
  --accent-wash: #e6f0fc;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --seq-1: #cde2fb; --seq-2: #9ec5f4; --seq-3: #6da7ec; --seq-4: #3987e5; --seq-5: #256abf; --seq-6: #184f95; --seq-7: #0d366b;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --good-ink: #006300;
  --div-b3: #256abf; --div-b2: #6da7ec; --div-b1: #b7d3f6; --div-mid: #f0efec; --div-r1: #f6c7c6; --div-r2: #e88180; --div-r3: #c93a3a;
  --unknown-hatch: repeating-linear-gradient(45deg, #d9d8d2 0 4px, transparent 4px 8px);
  --radius: 10px;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04);
  --font: system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --accent: #3987e5; --accent-wash: #1b2a3d;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --seq-1: #104281; --seq-2: #184f95; --seq-3: #1c5cab; --seq-4: #256abf; --seq-5: #3987e5; --seq-6: #6da7ec; --seq-7: #9ec5f4;
    --good-ink: #0ca30c;
    --div-b3: #3987e5; --div-b2: #1c5cab; --div-b1: #104281; --div-mid: #383835; --div-r1: #6b2626; --div-r2: #a83434; --div-r3: #e66767;
    --unknown-hatch: repeating-linear-gradient(45deg, #3a3a37 0 4px, transparent 4px 8px);
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321;
  --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
  --accent: #3987e5; --accent-wash: #1b2a3d;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --seq-1: #104281; --seq-2: #184f95; --seq-3: #1c5cab; --seq-4: #256abf; --seq-5: #3987e5; --seq-6: #6da7ec; --seq-7: #9ec5f4;
  --good-ink: #0ca30c;
  --div-b3: #3987e5; --div-b2: #1c5cab; --div-b1: #104281; --div-mid: #383835; --div-r1: #6b2626; --div-r2: #a83434; --div-r3: #e66767;
  --unknown-hatch: repeating-linear-gradient(45deg, #3a3a37 0 4px, transparent 4px 8px);
  --shadow: none;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
h1, h2, h3, h4 { margin: 0; line-height: 1.25; }
h2 { font-size: 18px; }
h3 { font-size: 15px; }
p { margin: 0 0 8px; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
.small { font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
.hidden { display: none !important; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
.sidebar { background: var(--surface); border-right: 1px solid var(--border); padding: 16px 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; gap: 10px; align-items: center; padding: 4px 6px 14px; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.brand-name { font-weight: 700; font-size: 14px; }
.brand-sub { font-size: 11px; color: var(--muted); }
.ws-picker { width: 100%; margin: 0 0 14px; }
.nav-group { margin-bottom: 14px; }
.nav-group-title { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 0 8px 4px; display: flex; justify-content: space-between; }
.nav-item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: none; border: 0; color: var(--ink-2); padding: 7px 8px; border-radius: 7px; font: inherit; cursor: pointer; }
.nav-item:hover { background: var(--surface-2); color: var(--ink); }
.nav-item.active { background: var(--accent-wash); color: var(--ink); font-weight: 600; }
.nav-item .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--axis); flex: none; }
.nav-item.active .dot { background: var(--accent); }
.main { min-width: 0; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 14px 24px; border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 5; }
.topbar h1 { font-size: 17px; }
.topbar .spacer { flex: 1; }
.menu-btn { display: none; }
.content { padding: 20px 24px 60px; max-width: 1400px; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
.page-head p { max-width: 760px; color: var(--ink-2); margin: 4px 0 0; }
.banner { background: var(--accent-wash); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 16px; color: var(--ink-2); font-size: 13px; }

/* ---------- primitives ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.card-head .sub { font-size: 12px; color: var(--muted); }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.stack > * + * { margin-top: 16px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn { font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--critical); }
.btn.sm { padding: 4px 9px; font-size: 12px; }
input, select, textarea { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 6px 9px; min-width: 0; }
textarea { width: 100%; min-height: 70px; resize: vertical; }
input[type="number"] { width: 100px; }
input[type="range"] { padding: 0; accent-color: var(--accent); }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ink-2); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font: inherit; font-size: 12px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--ink-2); cursor: pointer; }
.chip:hover { color: var(--ink); }
.chip.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--border); margin: 1px 2px 1px 0; white-space: nowrap; }
.status { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.status[style*="--c"]::before { background: var(--c); }
.status.good::before { background: var(--good); }
.status.warning::before { background: var(--warning); }
.status.serious::before { background: var(--serious); }
.status.critical::before { background: var(--critical); }

/* ---------- KPI tiles ---------- */
.kpi { padding: 14px 16px; }
.kpi .label { font-size: 12px; color: var(--ink-2); }
.kpi .value { font-size: 28px; font-weight: 650; margin-top: 2px; letter-spacing: -.01em; }
.kpi .foot { font-size: 12px; color: var(--muted); margin-top: 2px; }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { font-size: 12px; font-weight: 600; color: var(--ink-2); background: var(--surface-2); position: sticky; top: 0; white-space: nowrap; }
th.sortable { cursor: pointer; }
th.sortable:hover { color: var(--ink); }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--surface-2); }
tr.selected td { background: var(--accent-wash); }
td.r, th.r { text-align: right; }
tbody tr:last-child td { border-bottom: 0; }
td input, td select { width: 100%; }
td input[type="number"] { width: 90px; }

/* ---------- fit bar ---------- */
.fitbar { display: flex; align-items: center; gap: 8px; min-width: 140px; }
.fitbar .track { flex: 1; height: 8px; background: var(--surface-2); border-radius: 4px; position: relative; }
.fitbar .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--s1); border-radius: 0 4px 4px 0; }
.fitbar .ev { position: absolute; top: -3px; width: 2px; height: 14px; background: var(--ink); border-radius: 1px; }
.fitbar .n { width: 26px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }

/* ---------- drawer ---------- */
.drawer-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.25); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100vw); background: var(--surface); border-left: 1px solid var(--border); z-index: 21; overflow-y: auto; padding: 20px; box-shadow: -8px 0 30px rgba(0,0,0,.12); }
.drawer h2 { font-size: 20px; }
.drawer section { margin-top: 18px; }
.drawer section > h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 8px; }
.kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.bottomline { font-size: 15px; padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--surface-2); border-radius: 0 8px 8px 0; }
.dimrow { display: grid; grid-template-columns: 1fr 120px 110px 34px; gap: 8px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--grid); font-size: 13px; }
.check { display: flex; gap: 8px; align-items: center; padding: 3px 0; font-size: 13px; }
.notice { font-size: 12px; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border); color: var(--ink-2); }

/* ---------- charts ---------- */
.chart { width: 100%; display: block; overflow: visible; }
.chart text { fill: var(--ink-2); font: 11px var(--font); }
.chart .value-label { fill: var(--ink); font-weight: 600; }
.chart .gridline { stroke: var(--grid); stroke-width: 1; }
.chart .baseline { stroke: var(--axis); stroke-width: 1; }
.chart .hit { fill: transparent; cursor: pointer; }
.chart .hit:hover + .mark, .chart .mark:hover { opacity: .85; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.tooltip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--surface); font-size: 12px; padding: 6px 9px; border-radius: 6px; max-width: 280px; box-shadow: 0 4px 14px rgba(0,0,0,.2); }
.hatch { background: var(--unknown-hatch); }

/* ---------- tile map ---------- */
.tilemap { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 3px; }
.tile { aspect-ratio: 1; border-radius: 4px; display: grid; place-items: center; font-size: 11px; font-weight: 600; cursor: pointer; border: 1px solid transparent; color: var(--ink); background: var(--surface-2); }
.tile.dark-ink { color: #fff; }
.tile.sel { outline: 2px solid var(--ink); outline-offset: 1px; }
.tile.empty { cursor: default; background: transparent; }
.ramp { display: flex; gap: 2px; align-items: center; font-size: 11px; color: var(--muted); }
.ramp i { width: 22px; height: 8px; border-radius: 2px; display: inline-block; }

/* ---------- stamped inputs (operating truth) ---------- */
.stamp { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border); }
.stamp-claim { background: color-mix(in srgb, var(--s1) 18%, transparent); }
.stamp-testimony { background: color-mix(in srgb, var(--s3) 20%, transparent); }
.stamp-preference { background: color-mix(in srgb, var(--s4) 22%, transparent); }
.stamp-unknown { background: var(--unknown-hatch); }
.truth-row { display: grid; grid-template-columns: minmax(0,1fr) 120px; gap: 4px 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--grid); }
.truth-bar { height: 10px; border-radius: 3px; background: var(--s1); }

/* ---------- modal ---------- */
.modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 30; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); border-radius: 12px; padding: 20px; width: min(560px, 100%); max-height: 90vh; overflow-y: auto; border: 1px solid var(--border); }
.modal h2 { margin-bottom: 12px; }
.modal .row { margin-top: 12px; justify-content: flex-end; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 9px 16px; border-radius: 8px; z-index: 60; font-size: 13px; }

/* ---------- HAI / SIR cells ---------- */
.sir { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
td.sir, i.sir { background: var(--surface-2); }
.sir.b3 { background: var(--div-b3); color: #fff; } .sir.b2 { background: var(--div-b2); color: #fff; } .sir.b1 { background: var(--div-b1); }
.sir.mid { background: var(--div-mid); } .sir.r1 { background: var(--div-r1); } .sir.r2 { background: var(--div-r2); color: #fff; } .sir.r3 { background: var(--div-r3); color: #fff; }
.sir.na { color: var(--muted); font-weight: 400; }
i.sir { display: inline-block; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
table.hai td, table.hai th { padding: 7px 8px; }
table.hai td.sir { border-left: 2px solid var(--surface); }
.drawer.wide { width: min(980px, 100vw); }
.present { position: fixed; inset: 0; z-index: 40; background: var(--page); overflow-y: auto; }
.present-bar { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 24px; background: var(--surface); border-bottom: 1px solid var(--border); z-index: 1; }
.present-body { max-width: 1200px; margin: 0 auto; padding: 24px; }
.present-head h2 { font-size: 30px; }
@media print {
  body > *:not(.present) { display: none !important; }
  .present { position: static; overflow: visible; }
  .present-bar { display: none; }
  .card { break-inside: avoid; box-shadow: none; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

/* ---------- responsive ---------- */
@media (max-width: 1100px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: fixed; z-index: 25; width: 270px; transform: translateX(-100%); transition: transform .2s; box-shadow: 8px 0 30px rgba(0,0,0,.15); }
  .sidebar.open { transform: none; }
  .menu-btn { display: inline-block; }
  #wsLabel { display: none; }
  .content { padding: 16px 16px 60px; }
  .topbar { padding: 12px 16px; }
  .g2, .g3, .g4 { grid-template-columns: 1fr; }
  .kv { grid-template-columns: 1fr; }
  .dimrow { grid-template-columns: 1fr 1fr; }
}
@media print { .sidebar, .topbar { display: none; } .app { display: block; } }
@media (forced-colors: active) { .fitbar .fill, .truth-bar { background: CanvasText; } }

</style>
</head>
<body>
  <div id="fallback" style="padding:24px;font-family:system-ui,sans-serif">Loading the engine… If this message stays, this viewer is not running the page's scripts. Open the file in Chrome, Edge or Safari.</div>
  <div class="app">
    <nav class="sidebar" id="nav" aria-label="Modules"></nav>
    <main class="main">
      <header class="topbar">
        <button class="btn menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
        <h1 id="pageTitle">Overview</h1>
        <span class="muted small" id="wsLabel"></span>
        <span class="spacer"></span>
        <button class="btn sm" id="themeBtn" title="Cycle theme: system / light / dark">◐ Theme</button>
      </header>
      <div class="content" id="page"></div>
    </main>
  </div>
  <!-- core -->
  <script>/* js/core.js */
/* CIE Master core: storage, workspaces, module registry, scoring, shared UI helpers.
   Plain script (no ES modules) so the app opens by double-click from disk. */
(function () {
  'use strict';

  const CIE = (window.CIE = window.CIE || {});
  CIE.version = '1.0.0';
  CIE.modules = [];
  CIE.groups = [
    { id: 'intel', title: 'Account Intelligence' },
    { id: 'market', title: 'Market & Revenue' },
    { id: 'pilot', title: 'Pilot & Gates' },
    { id: 'knowledge', title: 'Knowledge' },
    { id: 'custom', title: 'Custom modules' },
    { id: 'system', title: 'Workspace' },
  ];

  /* ---------------- formatting ---------------- */
  const esc = (CIE.esc = (s) =>
    String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])));
  CIE.num = (n, d = 0) => (n == null || isNaN(n) ? '—' : Number(n).toLocaleString('en-US', { maximumFractionDigits: d, minimumFractionDigits: d }));
  CIE.money = (n) => {
    if (n == null || isNaN(n)) return '—';
    const a = Math.abs(n), s = n < 0 ? '−' : '';
    if (a >= 1e9) return s + '$' + (a / 1e9).toFixed(2) + 'B';
    if (a >= 1e6) return s + '$' + (a / 1e6).toFixed(1) + 'M';
    if (a >= 1e4) return s + '$' + Math.round(a / 1e3) + 'K';
    return s + '$' + Math.round(a).toLocaleString('en-US');
  };
  CIE.pct = (n, d = 0) => (n == null || isNaN(n) ? '—' : (n * 100).toFixed(d) + '%');
  CIE.uid = (p = 'id') => p + '_' + Math.random().toString(36).slice(2, 9);
  CIE.clone = (o) => JSON.parse(JSON.stringify(o));
  CIE.roundHalfUp = (x) => Math.floor(x + 0.5);

  /* ---------------- safe storage ---------------- */
  const store = (CIE.store = {
    get(k, fallback) {
      try { const v = localStorage.getItem(k); return v == null ? fallback : JSON.parse(v); } catch (e) { return fallback; }
    },
    set(k, v) {
      try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; }
    },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* storage unavailable */ } },
  });
  const KEY_INDEX = 'cie-master:index';
  const KEY_PREFS = 'cie-master:prefs';
  const wsKey = (id) => 'cie-master:ws:' + id;

  /* ---------------- workspace model ---------------- */
  CIE.STAGES = [
    { id: 'identified', label: 'Identified' },
    { id: 'identity_resolved', label: 'Identity resolved' },
    { id: 'workflow_evidenced', label: 'Workflow evidenced' },
    { id: 'research_ready', label: 'Research-ready' },
    { id: 'outreach_ready', label: 'Outreach-ready' },
    { id: 'qualified', label: 'Qualified opportunity' },
  ];
  CIE.CHECKS = [
    { id: 'identity', label: 'Identity and parent resolved' },
    { id: 'workflow', label: 'Workflow evidenced' },
    { id: 'buyer', label: 'Buyer and owner hypothesis' },
    { id: 'trigger', label: 'Sourced reason to act now' },
  ];
  CIE.EVIDENCE = ['evidenced', 'estimated', 'unknown'];
  CIE.REL_STRENGTH = [
    { id: 'none', label: 'None recorded', boost: 0 },
    { id: 'possible', label: 'Possible path', boost: 4 },
    { id: 'warm', label: 'Warm introduction', boost: 7 },
    { id: 'direct', label: 'Direct relationship', boost: 10 },
  ];
  CIE.STAMPS = ['claim', 'testimony', 'preference', 'unknown'];

  CIE.blankWorkspace = function (name) {
    return {
      id: CIE.uid('ws'),
      schema: 1,
      name: name || 'New engagement',
      company: '',
      subtitle: 'Commercial intelligence engine',
      asOf: new Date().toISOString().slice(0, 10),
      thesis: '',
      offering: { unit: 'user', price: 2400 },
      enabledModules: null, // null = every registered module
      dimensions: [
        { key: 'workflow', label: 'Workflow fit', weight: 30 },
        { key: 'scale', label: 'Scale', weight: 20 },
        { key: 'integration', label: 'Integration', weight: 20 },
        { key: 'budget', label: 'Budget', weight: 15 },
        { key: 'trigger', label: 'Trigger', weight: 10 },
        { key: 'relationship', label: 'Relationship', weight: 5 },
      ],
      segments: [],
      lenses: [{ id: 'all', label: 'All accounts', filter: {} }],
      accounts: [],
      findings: [],
      market: {
        prices: { low: 2400, base: 3600, high: 4800 },
        segments: [],
        capacity: { reps: 4, rampMonths: 6, dealsPerRep: 6, acv: 60000, expansion: 1.15 },
      },
      bridge: { start: 0, unit: '$M', steps: [] },
      truth: { groups: [], questions: [] },
      economics: { implementation: 0.25, screen: 3, prices: [], streams: [
        { label: 'Time returned to staff', perUnit: 7488, share: 0.6, counted: true, basis: '3 h/week × 52 × $48' },
        { label: 'Quality / compliance (not counted)', perUnit: 1000, share: 1, counted: false, basis: 'shown, never in the return' },
      ] },
      gates: { oneLine: '', stopRules: '', gates: [], cohort: [], valueTypes: [] },
      deals: { byAccount: {}, plays: [] },
      diligence: [],
      sources: [],
      glossary: [],
      decisions: [],
      custom: [],
      datasets: {},
    };
  };

  // Fill keys a workspace from an older export may be missing.
  CIE.normalize = function (ws) {
    const base = CIE.blankWorkspace(ws.name);
    for (const k of Object.keys(base)) if (ws[k] === undefined) ws[k] = base[k];
    for (const k of Object.keys(base.market)) if (ws.market[k] === undefined) ws.market[k] = base.market[k];
    for (const k of Object.keys(base.gates)) if (ws.gates[k] === undefined) ws.gates[k] = base.gates[k];
    ws.market.segments.forEach((s) => ['retain', 'fit', 'upu'].forEach((k) => { if (!Array.isArray(s[k])) s[k] = [0, 0, 0]; }));
    ws.accounts.forEach((a) => {
      a.scores = a.scores || {};
      a.checks = a.checks || {};
      a.tags = a.tags || [];
      a.people = a.people || [];
      a.relationship = a.relationship || { owner: '', strength: 'none', note: '' };
      a.value = a.value || { users: a.users || 0, hours: 3, rate: 48, share: 0.6, multiple: 3 };
      a.stage = a.stage || 'identified';
    });
    return ws;
  };

  /* ---------------- workspace persistence ---------------- */
  CIE.listWorkspaces = () => store.get(KEY_INDEX, []);
  // Large tables (ws.datasets, e.g. thousands of facilities) live in IndexedDB; the rest in localStorage.
  const idb = (CIE.idb = {
    db: null,
    open() {
      if (this.db) return Promise.resolve(this.db);
      return new Promise((res) => {
        try {
          const rq = indexedDB.open('cie-master', 1);
          rq.onupgradeneeded = () => rq.result.createObjectStore('datasets');
          rq.onsuccess = () => res((this.db = rq.result));
          rq.onerror = () => res(null);
        } catch (e) { res(null); }
      });
    },
    async get(k) {
      const db = await this.open();
      if (!db) return undefined;
      return new Promise((res) => { try { const r = db.transaction('datasets').objectStore('datasets').get(k); r.onsuccess = () => res(r.result); r.onerror = () => res(undefined); } catch (e) { res(undefined); } });
    },
    async set(k, v) {
      const db = await this.open();
      if (!db) return false;
      return new Promise((res) => { try { const t = db.transaction('datasets', 'readwrite'); t.objectStore('datasets').put(v, k); t.oncomplete = () => res(true); t.onerror = () => res(false); } catch (e) { res(false); } });
    },
    async del(k) {
      const db = await this.open();
      if (!db) return;
      try { db.transaction('datasets', 'readwrite').objectStore('datasets').delete(k); } catch (e) { /* ignore */ }
    },
  });
  CIE.loadWorkspace = async (id) => {
    const ws = store.get(wsKey(id), null);
    if (!ws) return null;
    if (ws.hasDatasets) ws.datasets = (await idb.get(id)) || {};
    return CIE.normalize(ws);
  };
  CIE.saveWorkspace = function (ws) {
    ws.updatedAt = new Date().toISOString();
    const { datasets, _dsDirty, ...rest } = ws;
    rest.hasDatasets = !!(datasets && Object.keys(datasets).length);
    if (rest.hasDatasets && _dsDirty) { idb.set(ws.id, datasets); delete ws._dsDirty; }
    const ok = store.set(wsKey(ws.id), rest);
    const idx = CIE.listWorkspaces().filter((w) => w.id !== ws.id);
    idx.push({ id: ws.id, name: ws.name });
    store.set(KEY_INDEX, idx);
    return ok;
  };
  CIE.deleteWorkspace = function (id) {
    store.del(wsKey(id));
    idb.del(id);
    store.set(KEY_INDEX, CIE.listWorkspaces().filter((w) => w.id !== id));
  };
  CIE.prefs = store.get(KEY_PREFS, {});
  CIE.savePrefs = () => store.set(KEY_PREFS, CIE.prefs);

  /* ---------------- module registry ---------------- */
  // A module: { id, group, title, order, describe, render(root, ctx) }.
  CIE.registerModule = function (def) {
    if (!def.id || !def.render) throw new Error('Module needs id and render');
    CIE.modules = CIE.modules.filter((m) => m.id !== def.id).concat(def);
  };
  CIE.activeModules = function (ws) {
    const builtIn = CIE.modules
      .filter((m) => m.group === 'system' || !ws.enabledModules || ws.enabledModules.includes(m.id))
      .slice();
    const custom = (ws.custom || []).map((c, i) => CIE.customModule(c, i));
    return builtIn.concat(custom).sort((a, b) => (a.order || 50) - (b.order || 50));
  };

  /* ---------------- scoring ---------------- */
  CIE.weightsOf = (ws, override) => {
    const w = {};
    ws.dimensions.forEach((d) => (w[d.key] = override && override[d.key] != null ? override[d.key] : d.weight));
    return w;
  };
  // fit = Σ(weight × score/5) / Σweight × 100; unknown dimensions score 0 (never guessed).
  CIE.score = function (a, ws, override) {
    const w = CIE.weightsOf(ws, override);
    let tot = 0, got = 0, ev = 0;
    const parts = ws.dimensions.map((d) => {
      const s = a.scores[d.key] || { v: 0, s: 'unknown' };
      const v = s.s === 'unknown' ? 0 : Number(s.v) || 0;
      const pts = (w[d.key] * v) / 5;
      tot += w[d.key];
      got += pts;
      if (s.s === 'evidenced') ev += w[d.key];
      return { key: d.key, label: d.label, weight: w[d.key], v, status: s.s || 'unknown', pts };
    });
    const fit = tot ? Math.round((got / tot) * 100) : 0;
    return { fit, completeness: tot ? ev / tot : 0, parts };
  };
  CIE.relBoost = (a) => (CIE.REL_STRENGTH.find((r) => r.id === (a.relationship && a.relationship.strength)) || { boost: 0 }).boost;
  CIE.checksPassed = (a) => CIE.CHECKS.every((c) => a.checks[c.id]);
  // Outreach-ready (and above) requires every check; downgrade otherwise.
  CIE.enforceStage = function (a) {
    const i = CIE.STAGES.findIndex((s) => s.id === a.stage);
    const or = CIE.STAGES.findIndex((s) => s.id === 'outreach_ready');
    if (i >= or && !CIE.checksPassed(a)) { a.stage = 'research_ready'; return true; }
    return false;
  };

  /* Ranked list: score every account (optionally under a lens's weights), sort by fit, then evidence. */
  CIE.rank = function (ws, lens) {
    const override = lens && lens.weights;
    return ws.accounts
      .filter((a) => CIE.lensMatch(a, lens))
      .map((a) => {
        const s = CIE.score(a, ws, override);
        const access = lens && lens.access ? Math.min(100, s.fit + CIE.relBoost(a)) : s.fit;
        return { a, s, rankScore: access };
      })
      .sort((x, y) => y.rankScore - x.rankScore || y.s.completeness - x.s.completeness || x.a.name.localeCompare(y.a.name));
  };
  CIE.findAccount = (ws, id) => ws.accounts.find((a) => a.id === id);
  CIE.stageLabel = (id) => (CIE.STAGES.find((s) => s.id === id) || { label: id }).label;

  // Buyer value: users × hours/week × 52 × loaded rate × share finance will count.
  CIE.valueModel = function (v, price) {
    const perUser = (Number(v.hours) || 0) * 52 * (Number(v.rate) || 0) * (Number(v.share) || 0);
    const users = Number(v.users) || 0;
    return {
      perUser,
      total: perUser * users,
      perDollar: price ? perUser / price : 0,
      maxPrice: v.multiple ? perUser / v.multiple : 0,
      contract: price * users,
    };
  };

  CIE.lensMatch = function (a, lens) {
    const f = (lens && lens.filter) || {};
    if (f.segments && f.segments.length && !f.segments.includes(a.segment)) return false;
    if (f.states && f.states.length && !f.states.includes(a.state)) return false;
    if (f.tags && f.tags.length && !f.tags.some((t) => a.tags.includes(t))) return false;
    if (f.excludeTags && f.excludeTags.some((t) => a.tags.includes(t))) return false;
    if (f.stages && f.stages.length && !f.stages.includes(a.stage)) return false;
    return true;
  };

  /* ---------------- CSV / files ---------------- */
  CIE.toCSV = function (rows, cols) {
    const q = (v) => {
      const s = String(v == null ? '' : v);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    return [cols.map((c) => q(c.label)).join(',')].concat(rows.map((r) => cols.map((c) => q(c.get(r))).join(','))).join('\n');
  };
  CIE.download = function (name, text, mime) {
    const blob = new Blob([text], { type: mime || 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  };
  CIE.slug = (s) => String(s || 'workspace').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

  /* ---------------- UI helpers ---------------- */
  CIE.toast = function (msg) {
    document.querySelectorAll('.toast').forEach((n) => n.remove());
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2200);
  };
  CIE.modal = function (title, bodyHtml, actions) {
    const back = document.createElement('div');
    back.className = 'modal-back';
    back.innerHTML = `<div class="modal" role="dialog" aria-label="${esc(title)}"><h2>${esc(title)}</h2>${bodyHtml}<div class="row">${(actions || [])
      .map((a, i) => `<button class="btn ${a.primary ? 'primary' : ''}" data-i="${i}">${esc(a.label)}</button>`)
      .join('')}<button class="btn" data-close>Close</button></div></div>`;
    document.body.appendChild(back);
    const close = () => back.remove();
    back.addEventListener('click', (e) => {
      if (e.target === back || e.target.hasAttribute('data-close')) return close();
      const i = e.target.getAttribute('data-i');
      if (i != null && actions[i].run(back.querySelector('.modal')) !== false) close();
    });
    return back;
  };

  // Global tooltip: any element with data-tip shows it on hover.
  let tipEl = null;
  document.addEventListener('mouseover', (e) => {
    const t = e.target.closest && e.target.closest('[data-tip]');
    if (!t) { if (tipEl) tipEl.style.display = 'none'; return; }
    if (!tipEl) { tipEl = document.createElement('div'); tipEl.className = 'tooltip'; document.body.appendChild(tipEl); }
    tipEl.innerHTML = t.getAttribute('data-tip');
    tipEl.style.display = 'block';
  });
  document.addEventListener('mousemove', (e) => {
    if (!tipEl || tipEl.style.display === 'none') return;
    const x = Math.min(e.clientX + 14, window.innerWidth - tipEl.offsetWidth - 8);
    tipEl.style.left = x + 'px';
    tipEl.style.top = e.clientY + 14 + 'px';
  });

  CIE.fitBar = (fit, completeness) =>
    `<div class="fitbar" data-tip="Fit ${fit} / 100 · ${Math.round(completeness * 100)}% of weight evidenced (black tick)"><div class="track"><div class="fill" style="width:${fit}%"></div><div class="ev" style="left:calc(${Math.round(
      completeness * 100
    )}% - 1px)"></div></div><span class="n">${fit}</span></div>`;

  CIE.SERIES = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)', 'var(--s6)', 'var(--s7)', 'var(--s8)'];
  // Color follows the entity: a segment keeps its slot no matter the filter.
  CIE.segmentColor = (ws, seg) => {
    const i = ws.segments.findIndex((s) => s.id === seg || s.name === seg);
    return i >= 0 && i < 8 ? CIE.SERIES[i] : 'var(--muted)';
  };
  CIE.segmentName = (ws, seg) => (ws.segments.find((s) => s.id === seg) || { name: seg || '—' }).name;
})();

</script>
  <script>/* js/charts.js */
/* Inline-SVG charts. Thin marks, rounded data-ends on the baseline, recessive axes,
   per-mark tooltips through data-tip. No dependencies. */
(function () {
  'use strict';
  const CIE = window.CIE;
  const esc = CIE.esc;
  const C = (CIE.charts = {});

  const nice = (max) => {
    if (max <= 0) return 1;
    const p = Math.pow(10, Math.floor(Math.log10(max)));
    const m = max / p;
    return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p;
  };
  // Bar with 4px rounding on the data end only.
  const hbarPath = (x, y, w, h, r = 4) => {
    if (w <= 0) return '';
    r = Math.min(r, w, h / 2);
    return `M${x},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h - r}Q${x + w},${y + h} ${x + w - r},${y + h}H${x}Z`;
  };
  const vbarPath = (x, y, w, h, r = 4) => {
    if (h <= 0) return '';
    r = Math.min(r, h, w / 2);
    return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
  };
  C.hbarPath = hbarPath;

  /* Horizontal bar list. items: [{label, value, color?, tip?, id?, marker?}] */
  C.barList = function (items, opt = {}) {
    const W = opt.width || 640, row = opt.row || 24, labelW = opt.labelWidth || 190, valW = 64;
    const H = items.length * row + 6;
    const max = opt.max || Math.max(1, ...items.map((d) => d.value));
    const plotW = W - labelW - valW;
    const fmt = opt.format || ((v) => CIE.num(v));
    const bars = items
      .map((d, i) => {
        const y = i * row + 4, bh = Math.min(14, row - 8), w = (Math.max(0, d.value) / max) * plotW;
        const label = d.label.length > 30 ? d.label.slice(0, 29) + '…' : d.label;
        const marker = d.marker != null ? `<line x1="${labelW + d.marker * plotW}" x2="${labelW + d.marker * plotW}" y1="${y - 2}" y2="${y + bh + 2}" stroke="var(--ink)" stroke-width="2"/>` : '';
        return `<g ${d.id ? `data-id="${esc(d.id)}"` : ''} data-tip="${esc(d.tip || d.label + ': ' + fmt(d.value))}" style="${d.id ? 'cursor:pointer' : ''}">
          <rect x="0" y="${i * row}" width="${W}" height="${row}" class="hit"/>
          <text x="${labelW - 8}" y="${y + bh - 3}" text-anchor="end">${esc(label)}</text>
          <path d="${hbarPath(labelW, y, w, bh)}" fill="${d.color || 'var(--s1)'}" class="mark"/>${marker}
          <text x="${labelW + w + 6}" y="${y + bh - 3}" class="value-label">${esc(fmt(d.value))}</text></g>`;
      })
      .join('');
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.title || 'Bar chart')}"><line class="baseline" x1="${labelW}" x2="${labelW}" y1="0" y2="${H}"/>${bars}</svg>`;
  };

  /* Stacked single bar (composition), with 2px surface gaps between segments. */
  C.stackBar = function (parts, opt = {}) {
    const W = opt.width || 640, H = 22;
    const tot = parts.reduce((s, p) => s + p.value, 0) || 1;
    let x = 0;
    const segs = parts
      .map((p) => {
        const w = (p.value / tot) * W;
        const s = `<rect x="${x}" y="0" width="${Math.max(0, w - 2)}" height="${H}" rx="3" fill="${p.color}" data-tip="${esc(p.label)}: ${CIE.num(p.value)} (${Math.round((p.value / tot) * 100)}%)"/>`;
        x += w;
        return s;
      })
      .join('');
    const legend = `<div class="legend">${parts.map((p) => `<span><i style="background:${p.color}"></i>${esc(p.label)} · ${CIE.num(p.value)}</span>`).join('')}</div>`;
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.title || 'Composition')}">${segs}</svg>${legend}`;
  };

  /* Waterfall: steps [{label, value}] from a start value; total drawn at end. */
  C.waterfall = function (start, steps, opt = {}) {
    const W = opt.width || 1040, H = opt.height || 300, padL = 64, padB = 46, padT = 16;
    const fmt = opt.format || CIE.money;
    const bars = [{ label: opt.startLabel || 'Start', value: start, kind: 'total' }];
    let run = start;
    steps.forEach((s) => { bars.push({ label: s.label, value: s.value, from: run, kind: s.value >= 0 ? 'up' : 'down' }); run += s.value; });
    bars.push({ label: opt.endLabel || 'End', value: run, kind: 'total' });
    const hi = nice(Math.max(...bars.map((b) => (b.kind === 'total' ? b.value : Math.max(b.from, b.from + b.value))), 1));
    const lo = Math.min(0, ...bars.map((b) => (b.kind === 'total' ? b.value : Math.min(b.from, b.from + b.value))));
    const y = (v) => padT + ((hi - v) / (hi - lo || 1)) * (H - padT - padB);
    const bw = (W - padL) / bars.length;
    const ticks = [0, 0.25, 0.5, 0.75, 1].map((t) => lo + t * (hi - lo));
    const grid = ticks.map((t) => `<line class="gridline" x1="${padL}" x2="${W}" y1="${y(t)}" y2="${y(t)}"/><text x="${padL - 6}" y="${y(t) + 4}" text-anchor="end">${esc(fmt(t))}</text>`).join('');
    const color = { total: 'var(--s1)', up: 'var(--s3)', down: 'var(--s2)' };
    const marks = bars
      .map((b, i) => {
        const x = padL + i * bw + bw * 0.18, w = bw * 0.64;
        const a = b.kind === 'total' ? 0 : b.from, z = b.kind === 'total' ? b.value : b.from + b.value;
        const top = y(Math.max(a, z)), h = Math.max(1, Math.abs(y(a) - y(z)));
        const lbl = b.label.length > 14 ? b.label.slice(0, 13) + '…' : b.label;
        const vtxt = b.kind === 'total' ? fmt(b.value) : (b.value >= 0 ? '+' : '') + fmt(b.value);
        return `<g data-tip="${esc(b.label)}: ${esc(vtxt)}"><rect x="${x}" y="${top}" width="${w}" height="${h}" rx="3" fill="${color[b.kind]}"/>
          <text x="${x + w / 2}" y="${top - 5}" text-anchor="middle" class="value-label">${esc(vtxt)}</text>
          <text x="${x + w / 2}" y="${H - padB + 16}" text-anchor="middle">${esc(lbl)}</text></g>`;
      })
      .join('');
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.title || 'Waterfall')}">${grid}<line class="baseline" x1="${padL}" x2="${W}" y1="${y(0)}" y2="${y(0)}"/>${marks}</svg>
      <div class="legend"><span><i style="background:var(--s1)"></i>Total</span><span><i style="background:var(--s3)"></i>Increase</span><span><i style="background:var(--s2)"></i>Decrease</span></div>`;
  };

  /* Single-series line with an optional horizontal reference line. points: [{x, y}] */
  C.line = function (points, opt = {}) {
    const W = opt.width || 560, H = opt.height || 200, padL = 46, padB = 28, padT = 10, padR = 12;
    const xs = points.map((p) => p.x), ys = points.map((p) => p.y);
    const x0 = Math.min(...xs), x1 = Math.max(...xs);
    const yMax = nice(Math.max(...ys, opt.ref || 0, 0.0001));
    const sx = (v) => padL + ((v - x0) / (x1 - x0 || 1)) * (W - padL - padR);
    const sy = (v) => padT + (1 - v / yMax) * (H - padT - padB);
    const fx = opt.formatX || CIE.num, fy = opt.formatY || CIE.num;
    const ticks = [0, 0.25, 0.5, 0.75, 1];
    const grid = ticks.map((t) => `<line class="gridline" x1="${padL}" x2="${W - padR}" y1="${sy(t * yMax)}" y2="${sy(t * yMax)}"/><text x="${padL - 6}" y="${sy(t * yMax) + 4}" text-anchor="end">${esc(fy(t * yMax))}</text>`).join('');
    const xt = ticks.map((t) => { const v = x0 + t * (x1 - x0); return `<text x="${sx(v)}" y="${H - 8}" text-anchor="middle">${esc(fx(v))}</text>`; }).join('');
    const d = points.map((p, i) => `${i ? 'L' : 'M'}${sx(p.x).toFixed(1)},${sy(p.y).toFixed(1)}`).join('');
    const ref = opt.ref != null ? `<line x1="${padL}" x2="${W - padR}" y1="${sy(opt.ref)}" y2="${sy(opt.ref)}" stroke="var(--muted)" stroke-dasharray="4 4"/><text x="${W - padR}" y="${sy(opt.ref) - 5}" text-anchor="end">${esc(opt.refLabel || '')}</text>` : '';
    const mark = opt.markX != null ? (() => { const p = points.reduce((b, q) => (Math.abs(q.x - opt.markX) < Math.abs(b.x - opt.markX) ? q : b)); return `<circle cx="${sx(p.x)}" cy="${sy(p.y)}" r="5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>`; })() : '';
    const hits = points.map((p, i) => { const w = (W - padL - padR) / points.length; return `<rect class="hit" x="${sx(p.x) - w / 2}" y="${padT}" width="${w}" height="${H - padT - padB}" data-tip="${esc((opt.tipX || fx)(p.x))}: ${esc(fy(p.y))}"/>`; }).join('');

      });
      ws.sources = (M.sources || []).map((s) => ({ title: s.title, publisher: s.id, date: s.date || s.accessed, kind: /customer/i.test(s.kind) ? 'Customer testimony' : /vendor|company/i.test(s.kind) ? 'Vendor claim' : 'Public record', supports: s.note, url: s.url }));

      ws.diligence = (M.claims || []).map((c) => ({ question: c.claim, why: c.limit, owner: '', priority: 'P2', status: /verified|confirmed/i.test(c.status) ? 'Answered' : 'Open', answer: c.status }));

  /* =====================================================================
     4. Network / owner engine:  const DATA = { sites: [...], groups: [...] }
     ===================================================================== */
  CIE.registerImporter({
    id: 'network-owners',
    label: 'Network owner engine',
    detect: (html) => /const\s+DATA\s*=\s*\{\s*"sites"/.test(html),
    convert(html, name) {
      const D = constOf(html, 'DATA');
      const ws = base(name);
      ws.offering = { unit: 'site', price: 60000 };
      ws.dimensions = [
        { key: 'scale', label: 'Open sites', weight: 30 }, { key: 'growth', label: 'Growth: new and coming sites', weight: 15 },
        { key: 'footprint', label: 'Multi-state footprint', weight: 10 }, { key: 'lanes', label: 'Both service lanes', weight: 15 },
        { key: 'data', label: 'Data confidence', weight: 10 }, { key: 'proximity', label: 'Proximity to HQ', weight: 10 }, { key: 'relationship', label: 'Relationship', weight: 10 },
      ];
      ws.segments = segmentsFrom(D.groups.map((g) => g.type));
      const sitesBy = {};
      D.sites.forEach((s) => (sitesBy[s.gid] = sitesBy[s.gid] || []).push(s));
      const qOpen = quintiler(D.groups.map((g) => g.n_open)), qGrow = quintiler(D.groups.map((g) => (g.n_ramp || 0) + (g.n_pipe || 0)));
      ws.accounts = D.groups.map((g) => {
        const s0 = (sitesBy[g.id] || []).find((s) => s.lat != null) || {};
        return account({
          id: g.id, name: g.name, segment: slug(g.type), state: (g.states || [])[0] || s0.st, lat: s0.lat, lon: s0.lon,
          tags: [g.backer, g.clinic && g.pharmacy ? 'Both lanes' : '', g.recent_change ? 'Recent ownership change' : ''].filter(Boolean),
          scores: {
            scale: { v: qOpen(g.n_open), s: 'evidenced' }, growth: { v: (g.n_ramp || 0) + (g.n_pipe || 0) ? qGrow((g.n_ramp || 0) + (g.n_pipe || 0)) : 0, s: 'evidenced' },
            footprint: { v: Math.min(5, (g.states || []).length), s: 'evidenced' }, lanes: { v: g.clinic && g.pharmacy ? 5 : g.clinic || g.pharmacy ? 2 : 0, s: 'evidenced' },
            data: { v: Math.round((g.complete || 0) * 5), s: 'estimated' }, proximity: { v: g.dist_hq == null ? 0 : g.dist_hq < 250 ? 5 : g.dist_hq < 600 ? 3 : 1, s: g.dist_hq == null ? 'unknown' : 'evidenced' }, relationship: { v: 0, s: 'unknown' },
          },
          checks: { identity: true }, people: (g.people || []).map((p) => ({ name: p.name, role: p.role, source: '' })),
          value: { users: g.n_open || 0, hours: 3, rate: 48, share: 0.6, multiple: 3 },
          notes: (sitesBy[g.id] || []).map((s) => '• ' + s.site + (s.status ? ' (' + s.status + ')' : '')).join('\n'),
        });
      });
      ws.lenses = [{ id: 'all', label: 'All owners', filter: {} }].concat(ws.segments.map((s) => ({ id: 'seg_' + s.id, label: s.name, filter: { segments: [s.id] } }))).concat([{ id: 'warm', label: 'Pilot + access', filter: {}, access: true }]);
      return ws;
    },
  });

  /* =====================================================================
     5. Account universe:  const ACCOUNTS = [ { ..., components: {dimension: points} } ]
     ===================================================================== */
  CIE.registerImporter({
    id: 'account-universe',
    label: 'Account-universe engine',
    detect: (html) => /const\s+ACCOUNTS\s*=\s*\[/.test(html),
    convert(html, name) {
      const A = constOf(html, 'ACCOUNTS');
      const ws = base(name);
      const comps = {};
      A.forEach((a) => Object.entries(a.components || {}).forEach(([k, v]) => (comps[k] = Math.max(comps[k] || 0, Number(v) || 0))));
      ws.dimensions = Object.entries(comps).map(([k, max]) => ({ key: slug(k), label: k, weight: Math.round(max) || 10 }));
      ws.segments = segmentsFrom(A.map((a) => a.segment));
      ws.accounts = A.map((a) => {
        const scores = {};
        Object.entries(comps).forEach(([k, max]) => { const v = (a.components || {})[k]; scores[slug(k)] = v == null ? { v: 0, s: 'unknown' } : { v: Math.round((v / (max || 1)) * 5), s: 'estimated' }; });
        return account({
          id: a.id, name: a.name, segment: slug(a.segment), stage: /research|verify/i.test(a.triggerStatus || '') ? 'identity_resolved' : 'research_ready',
          tags: [a.priority, a.motion, a.existing ? 'Existing customer' : '', a.competitor ? 'Competitive takeout' : '', a.accountTier].filter(Boolean),
          scores, why: a.why, firstUse: (a.wedges || []).join(', '), uncertainty: a.statusNote, nextAction: a.activationRule, bottomLine: a.trigger ? 'Trigger: ' + a.trigger + ' (' + (a.triggerStatus || '') + ')' : '',
          checks: { identity: true }, notes: [a.scaleEvidence, a.initialPrice && 'Initial: ' + a.initialPrice, a.expansionPrice && 'Expansion: ' + a.expansionPrice, a.channel].filter(Boolean).join('\n'),
        });
      });
      ws.lenses = [{ id: 'all', label: 'All accounts', filter: {} }].concat([...new Set(A.map((a) => a.motion).filter(Boolean))].map((m) => ({ id: slug(m), label: m, filter: { tags: [m] } }))).concat([{ id: 'p1', label: 'P1 only', filter: { tags: ['P1'] } }]);
      return ws;
    },
  });

  /* ---------- entry point ---------- */
  CIE.importCIE = function (html, fileName) {
    const name = String(fileName || 'Imported CIE').replace(/\.(html?|json)$/i, '').replace(/^[0-9a-f]{8}-/i, '').replace(/_/g, ' ').replace(/\s*(Commercial Intelligence Engine|CIE)\b.*$/i, '').trim() || 'Imported CIE';
    const a = adapters.find((x) => x.detect(html));
    if (!a) throw new Error('This file does not contain a data layout the importer recognises. Supported: ' + adapters.map((x) => x.label).join(', ') + '.');
    const ws = a.convert(html, name);
    ws.name = name + ' (imported)';
    ws.importedFrom = { file: fileName, adapter: a.id, at: new Date().toISOString() };
    ws.accounts.forEach((acc) => CIE.enforceStage(acc));
    return { ws, adapter: a };
  };
})();

  <script>/* js/modules/overview.js */
/* Overview: start-here thesis, headline counts, top accounts, stage funnel, findings. */
(function () {
  'use strict';
  const CIE = window.CIE, esc = CIE.esc;

  CIE.registerModule({
    id: 'overview',
    group: 'intel',
    title: 'Overview',
    order: 10,
    describe: 'Headline counts, the start-here call, top accounts and what the data says.',
    render(root, ctx) {
      const ws = ctx.ws;
      const ranked = CIE.rank(ws, null);
      const top = ranked.slice(0, 15);
      const ready = ws.accounts.filter((a) => a.stage === 'outreach_ready' || a.stage === 'qualified').length;
      const users = ws.accounts.reduce((s, a) => s + (Number(a.value.users) || 0), 0);
      const avgEv = ranked.length ? ranked.reduce((s, r) => s + r.s.completeness, 0) / ranked.length : 0;
      const stageCounts = CIE.STAGES.map((st) => ({ label: st.label, value: ws.accounts.filter((a) => a.stage === st.id).length, color: 'var(--s1)' }));
      const segCounts = ws.segments.map((s) => ({ label: s.name, value: ws.accounts.filter((a) => a.segment === s.id).length, color: CIE.segmentColor(ws, s.id), tip: `${s.name}: ${ws.accounts.filter((a) => a.segment === s.id).length} accounts` }));
      const tone = { supports: 'good', challenges: 'serious', sizing: 'warning', pricing: 'warning' };

      root.innerHTML = `
        <div class="page-head"><div><h2>${esc(ws.company || ws.name)}</h2><p>${esc(ws.subtitle || '')}</p></div>
          <span class="tag">Private working model · ${esc(ws.asOf || '')}</span></div>
        ${ws.thesis ? `<div class="card" style="margin-bottom:16px"><div class="card-head"><h3>Start here</h3><span class="sub">The working call — change it in Workspace</span></div><p style="font-size:15px;margin:0">${esc(ws.thesis)}</p></div>` : ''}
        <div class="grid g4">
          <div class="card kpi"><div class="label">Accounts in the model</div><div class="value">${CIE.num(ws.accounts.length)}</div><div class="foot">${ws.segments.length} segments</div></div>
          <div class="card kpi"><div class="label">Outreach-ready</div><div class="value">${CIE.num(ready)}</div><div class="foot">all four checks passed; no contact implied</div></div>
          <div class="card kpi"><div class="label">Users across accounts</div><div class="value">${CIE.num(users)}</div><div class="foot">${CIE.money(users * ws.offering.price)} / yr at ${CIE.money(ws.offering.price)}</div></div>
          <div class="card kpi"><div class="label">Average evidence share</div><div class="value">${CIE.pct(avgEv)}</div><div class="foot">of scoring weight backed by a cited fact</div></div>
        </div>
        <div class="grid g2" style="margin-top:16px">
          <div class="card"><div class="card-head"><h3>Top 15 by fit</h3><span class="sub">bar = fit · black tick = evidence share · click to open</span></div>
            <div id="topChart">${CIE.charts.barList(top.map((r) => ({ id: r.a.id, label: r.a.name, value: r.s.fit, color: CIE.segmentColor(ws, r.a.segment), marker: r.s.completeness, tip: `${r.a.name}: fit ${r.s.fit}, ${Math.round(r.s.completeness * 100)}% evidenced` })), { max: 100, title: 'Top accounts by fit' })}</div>
            <div class="legend">${ws.segments.slice(0, 8).map((s) => `<span><i style="background:${CIE.segmentColor(ws, s.id)}"></i>${esc(s.name)}</span>`).join('')}</div>
            <p class="small muted" style="margin-top:8px">A long bar with the tick far to the left is promising but thinly evidenced — research it first.</p></div>
          <div class="stack">
            <div class="card"><div class="card-head"><h3>Accounts by stage</h3><span class="sub">data completeness, not contact</span></div>${CIE.charts.barList(stageCounts, { title: 'Accounts by stage', labelWidth: 170, row: 22 })}</div>
            <div class="card"><div class="card-head"><h3>Accounts by segment</h3></div>${CIE.charts.barList(segCounts, { title: 'Accounts by segment', labelWidth: 170, row: 22 })}</div>
          </div>
        </div>
        ${ws.findings.length ? `<h3 style="margin:22px 0 10px">What the data says</h3><div class="grid g2">${ws.findings.map((f) => `
          <div class="card"><div class="card-head"><span class="status ${tone[f.kind] || ''}">${esc(f.label || f.kind)}</span><span class="sub">confidence: ${esc(f.confidence || '—')}</span></div>
          <h3 style="margin-bottom:6px">${esc(f.title)}</h3><p class="ink2" style="margin:0">${esc(f.body)}</p></div>`).join('')}</div>` : ''}`;
      root.querySelectorAll('#topChart [data-id]').forEach((g) => (g.onclick = () => CIE.openAccount(ctx, g.dataset.id)));
    },
  });
})();

  <script>/* js/modules/accounts.js */
/* Target accounts: lens presets, filters, ranked table, account drawer with score parts,
   outreach checklist, relationship overlay and buyer value calculator. */
(function () {
  'use strict';
  const CIE = window.CIE, esc = CIE.esc;
  const view = { lens: 'all', seg: '', state: '', stage: '', q: '', sort: 'rank' };

  /* ---------- the account drawer (shared by every module) ---------- */
  CIE.openAccount = function (ctx, id) {
    const ws = ctx.ws, a = CIE.findAccount(ws, id);
    if (!a) return;
    const price = ws.offering.price;
    const draw = () => {
      const s = CIE.score(a, ws);
      const ranked = CIE.rank(ws, null);
      const pos = ranked.findIndex((r) => r.a.id === a.id) + 1;
      const v = CIE.valueModel(a.value, a.value.price || price);
      const curve = [];
      const pMax = Math.max(v.perUser * 1.5, (a.value.price || price) * 2, 100);
      for (let i = 1; i <= 24; i++) { const p = (pMax * i) / 24; curve.push({ x: p, y: v.perUser / p }); }
      const auto = `Rank #${pos} of ${ranked.length}. Fit ${s.fit} with ${Math.round(s.completeness * 100)}% of the scoring weight backed by evidence.${a.tags.includes('Builds own platform') ? ' Build-versus-buy risk is high.' : ''}`;
      return `
      <h2>${esc(a.name)}</h2>
      <div class="row" style="margin-top:6px"><span class="tag">${esc(CIE.stageLabel(a.stage))}</span><span class="tag">${esc(CIE.segmentName(ws, a.segment))}</span><span class="tag">${esc(a.state || '—')}</span>${a.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join('')}</div>
      ${a.facilityId && CIE.qualityData && CIE.qualityData(ws) ? `<div class="row" style="margin-top:10px"><button class="btn primary sm" data-hai="${esc(a.facilityId)}">Show HAI profile →</button></div>` : ''}
      <section><h3>Bottom line</h3><div class="bottomline">${esc(a.bottomLine || auto)}</div>${a.bottomLine ? `<p class="small muted" style="margin-top:6px">${esc(auto)}</p>` : ''}</section>

      <section><h3>Why it ranks here</h3>
        <div class="row" style="margin-bottom:6px">${CIE.fitBar(s.fit, s.completeness)}</div>
        ${s.parts.map((p) => `<div class="dimrow"><span>${esc(p.label)} <span class="muted small">· weight ${p.weight}</span></span>
          <select data-dim="${p.key}" data-k="v">${[0, 1, 2, 3, 4, 5].map((n) => `<option ${n === p.v && p.status !== 'unknown' ? 'selected' : ''}>${n}</option>`).join('')}</select>
          <select data-dim="${p.key}" data-k="s">${CIE.EVIDENCE.map((e) => `<option ${e === p.status ? 'selected' : ''}>${e}</option>`).join('')}</select>
          <span class="num small r">${p.pts.toFixed(1)}</span></div>`).join('')}
        <p class="small muted" style="margin-top:6px">Unknown dimensions score zero; they are never guessed. The black tick on the bar is the share of weight backed by evidence.</p>
      </section>

      <section><h3>Who uses it, who pays</h3><dl class="kv">
        ${[['why', 'Why this account'], ['user', 'User / workflow owner'], ['buyer', 'Economic buyer'], ['firstUse', 'First use to propose'], ['pilotEndpoint', 'Pilot endpoint'], ['uncertainty', 'Principal uncertainty'], ['nextAction', 'Next action']]
          .map(([k, l]) => `<dt>${l}</dt><dd><input data-f="${k}" value="${esc(a[k] || '')}" style="width:100%"></dd>`).join('')}
      </dl></section>

      <section><h3>Buying group</h3>
        ${a.people.length ? a.people.map((p) => `<div class="check"><b>${esc(p.name)}</b><span class="muted">${esc(p.role)}</span>${p.source ? `<a href="${esc(p.source)}" target="_blank" rel="noopener">source</a>` : '<span class="tag">unsourced</span>'}</div>`).join('') : '<p class="muted small">No named people yet. Names appear only with a link to the page that lists them; emails are never guessed.</p>'}
      </section>

      ${a.signals && a.signals.length ? `<section><h3>Dated signals</h3>${a.signals.map((g) => `<div class="check"><span class="muted num">${esc(g.date)}</span><span>${esc(g.fact)}</span></div>`).join('')}</section>` : ''}

      <section><h3>Stage and outreach checklist</h3>
        ${CIE.CHECKS.map((c) => `<label class="check"><input type="checkbox" data-check="${c.id}" ${a.checks[c.id] ? 'checked' : ''}> ${esc(c.label)}</label>`).join('')}
        <div class="row" style="margin-top:8px"><label class="field">Stage<select data-stage>${CIE.STAGES.map((st) => `<option value="${st.id}" ${st.id === a.stage ? 'selected' : ''}>${esc(st.label)}</option>`).join('')}</select></label></div>
        <p class="small muted" style="margin-top:6px">Outreach-ready describes data completeness, not contact. If the four checks are not all passed the stage is downgraded automatically.</p>
      </section>

      <section><h3>Relationship overlay</h3>
        <div class="grid g2"><label class="field">Who holds it<input data-rel="owner" value="${esc(a.relationship.owner || '')}"></label>
        <label class="field">Strength<select data-rel="strength">${CIE.REL_STRENGTH.map((r) => `<option value="${r.id}" ${r.id === a.relationship.strength ? 'selected' : ''}>${esc(r.label)}${r.boost ? ' (+' + r.boost + ' in access lenses)' : ''}</option>`).join('')}</select></label></div>
        <label class="field" style="margin-top:8px">Path / note<input data-rel="note" value="${esc(a.relationship.note || '')}"></label>
        <p class="small muted" style="margin-top:6px">Kept separate from fit. It only adds a visible boost in lenses marked “+ access”.</p>
      </section>

      <section><h3>Buyer value calculator</h3>
        <div class="grid g3">
          ${[['users', 'Users', 1], ['hours', 'Hours saved / user / week', 0.5], ['rate', 'Loaded hourly cost ($)', 1], ['share', 'Share finance will count (0–1)', 0.05], ['price', 'Price per ' + ws.offering.unit + ' / yr ($)', 100], ['multiple', 'Target return multiple', 0.5]]
            .map(([k, l, st]) => `<label class="field">${l}<input type="number" step="${st}" data-val="${k}" value="${a.value[k] != null ? a.value[k] : k === 'price' ? price : ''}"></label>`).join('')}
        </div>
        <div class="grid g3" style="margin-top:12px">
          <div class="card kpi"><div class="label">Value per ${esc(ws.offering.unit)} / yr</div><div class="value">${CIE.money(v.perUser)}</div></div>
          <div class="card kpi"><div class="label">Value per $1 of price</div><div class="value">${v.perDollar.toFixed(2)}×</div></div>
          <div class="card kpi"><div class="label">Highest price at ${a.value.multiple}×</div><div class="value">${CIE.money(v.maxPrice)}</div></div>
        </div>
        <div style="margin-top:10px">${CIE.charts.line(curve, { title: 'Return multiple by price', ref: a.value.multiple, refLabel: 'target ' + a.value.multiple + '×', markX: a.value.price || price, formatX: CIE.money, formatY: (y) => y.toFixed(1) + '×' })}</div>
        <p class="small muted">Account value ${CIE.money(v.total)} / yr against a contract of ${CIE.money(v.contract)}. Every input is an assumption until validated with the buyer.</p>
      </section>

      <section><h3>Notes</h3><textarea data-f="notes" placeholder="Your working notes — saved in this browser">${esc(a.notes || '')}</textarea>
        <label class="field" style="margin-top:8px">Bottom line override<input data-f="bottomLine" value="${esc(a.bottomLine || '')}" placeholder="Leave blank to use the computed line"></label></section>`;
    };
    const bind = (d) => {
      d.addEventListener('click', (e) => { const h = e.target.getAttribute && e.target.getAttribute('data-hai'); if (h) CIE.openFacility(ctx, h); });
      d.addEventListener('change', (e) => {
        const t = e.target;
        if (t.dataset.dim) {
          const cur = a.scores[t.dataset.dim] || { v: 0, s: 'unknown' };
          if (t.dataset.k === 'v') { cur.v = Number(t.value); if (cur.s === 'unknown' && cur.v > 0) cur.s = 'estimated'; } else cur.s = t.value;
          a.scores[t.dataset.dim] = cur;
        } else if (t.dataset.f) a[t.dataset.f] = t.value;
        else if (t.dataset.check) { a.checks[t.dataset.check] = t.checked; if (CIE.enforceStage(a)) CIE.toast('Stage set back to Research-ready: a check is missing'); }
        else if (t.hasAttribute('data-stage')) { a.stage = t.value; if (CIE.enforceStage(a)) CIE.toast('Outreach-ready needs all four checks — set to Research-ready'); }
        else if (t.dataset.rel) a.relationship[t.dataset.rel] = t.value;
        else if (t.dataset.val) a.value[t.dataset.val] = Number(t.value);
        else return;
        ctx.save();
        const top = d.scrollTop;
        d.innerHTML = `<div class="row" style="justify-content:flex-end;margin-bottom:6px"><button class="btn sm" data-close-drawer>Close ✕</button></div>` + draw();
        d.scrollTop = top;
      });
    };
    ctx.openDrawer(draw(), bind);
  };

  /* ---------- the module ---------- */
  CIE.registerModule({
    id: 'accounts',
    group: 'intel',
    title: 'Target accounts',
    order: 11,
    describe: 'Ranked accounts with lens presets, filters, score breakdown and value calculator.',
    render(root, ctx) {
      const ws = ctx.ws;
      const lens = ws.lenses.find((l) => l.id === view.lens) || ws.lenses[0];
      let rows = CIE.rank(ws, lens);
      const rankOf = new Map(rows.map((r, i) => [r.a.id, i + 1]));
      rows = rows.filter(({ a }) =>
        (!view.seg || a.segment === view.seg) && (!view.state || a.state === view.state) && (!view.stage || a.stage === view.stage) &&
        (!view.q || (a.name + ' ' + a.tags.join(' ') + ' ' + (a.why || '')).toLowerCase().includes(view.q.toLowerCase())));
      if (view.sort === 'name') rows.sort((x, y) => x.a.name.localeCompare(y.a.name));
      if (view.sort === 'evidence') rows.sort((x, y) => y.s.completeness - x.s.completeness);
      if (view.sort === 'users') rows.sort((x, y) => (y.a.value.users || 0) - (x.a.value.users || 0));
      const states = [...new Set(ws.accounts.map((a) => a.state).filter(Boolean))].sort();

      root.innerHTML = `
        <div class="page-head"><div><h2>Target accounts</h2><p>Pick the question you are answering with a lens, then click any row for the bottom line, score parts, buyer and value calculator.</p></div>
          <div class="row"><button class="btn" id="addAcc">+ Add account</button><button class="btn" id="csv">Export CSV (${rows.length})</button></div></div>
        <div class="chips" id="lenses">${ws.lenses.map((l) => `<button class="chip ${l.id === lens.id ? 'on' : ''}" data-lens="${esc(l.id)}" ${l.description ? `data-tip="${esc(l.description)}"` : ''}>${esc(l.label)}${l.access ? ' + access' : ''}</button>`).join('')}</div>
        <div class="row" style="margin:12px 0">
          <input id="q" placeholder="Search name, tag, reason…" value="${esc(view.q)}" style="min-width:220px">
          <select id="seg"><option value="">All segments</option>${ws.segments.map((s) => `<option value="${esc(s.id)}" ${s.id === view.seg ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select>
          <select id="st"><option value="">All states</option>${states.map((s) => `<option ${s === view.state ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>
          <select id="stage"><option value="">All stages</option>${CIE.STAGES.map((s) => `<option value="${s.id}" ${s.id === view.stage ? 'selected' : ''}>${esc(s.label)}</option>`).join('')}</select>
          <select id="sort">${[['rank', 'Sort: rank'], ['evidence', 'Sort: evidence'], ['users', 'Sort: users'], ['name', 'Sort: name']].map(([k, l]) => `<option value="${k}" ${k === view.sort ? 'selected' : ''}>${l}</option>`).join('')}</select>
        </div>
        <div class="table-wrap"><table>
          <thead><tr><th class="r">#</th><th>Account</th><th>Segment</th><th>State</th><th>Fit · evidence</th><th class="r">Users</th><th>Stage</th><th>Relationship</th></tr></thead>
          <tbody>${rows.map(({ a, s, rankScore }) => `<tr class="clickable" data-id="${esc(a.id)}">
            <td class="r num">${rankOf.get(a.id)}</td>
            <td><b>${esc(a.name)}</b><div class="small muted">${a.tags.map(esc).join(' · ')}</div></td>
            <td><span class="status" style="--c:${CIE.segmentColor(ws, a.segment)}">${esc(CIE.segmentName(ws, a.segment))}</span></td>
            <td>${esc(a.state || '')}</td>

        const tip = `${st.n}: ${has} account${has === 1 ? '' : 's'}${has ? ' · avg fit ' + Math.round((by[k] || []).reduce((s, r) => s + r.s.fit, 0) / has) : ''}`;

          <div class="row"><div class="chips">${[['count', 'Shade by account count'], ['fit', 'Shade by average fit']].map(([k, l]) => `<button class="chip ${view.metric === k ? 'on' : ''}" data-metric="${k}">${l}</button>`).join('')}</div>
          <label class="check"><input type="checkbox" id="dots" ${view.dots ? 'checked' : ''}> Account dots</label></div></div>
        <div class="grid" style="grid-template-columns:minmax(0,2fr) minmax(0,1fr)">
          <div class="card"><svg class="chart" viewBox="0 0 975 610" role="img" aria-label="US map of accounts" id="map">${shapes}${dots}</svg>
            <div class="row" style="justify-content:space-between;margin-top:6px"><div class="ramp">${view.metric === 'count' ? 'Fewer' : 'Lower fit'} ${[1, 2, 3, 4, 5, 6, 7].map((i) => `<i style="background:var(--seq-${i})"></i>`).join('')} ${view.metric === 'count' ? 'More' : 'Higher fit'}</div>
            <div class="legend" style="margin:0">${ws.segments.slice(0, 8).map((s) => `<span><i style="background:${CIE.segmentColor(ws, s.id)};border-radius:50%"></i>${esc(s.name)}</span>`).join('')}</div></div></div>

            <div class="card"><div class="card-head"><h3>Accounts by state</h3></div>${CIE.charts.barList(top, { labelWidth: 120, row: 20, width: 380, title: 'Accounts by state' })}</div>

      root.querySelectorAll('[data-metric]').forEach((b) => (b.onclick = () => { view.metric = b.dataset.metric; ctx.rerender(); }));

    },

})();

  <script>/* js/modules/quality.js */
/* Facility quality: measure-level infection (HAI) data per facility — observed, predicted, SIR,
   denominator, rate — with filters, pooled SIRs, a facility profile and a print-ready presentation view.
   Data lives in ws.datasets.quality = { title, source, period, measures[], rows[] }. */
(function () {
  'use strict';
  const CIE = window.CIE, esc = CIE.esc;
  const view = { q: '', state: '', type: '', grade: '', worse: false, hac: false, minBeds: 0, sort: 'priority', dir: -1, shown: 100, focus: '' };

  const sirClass = (s) => (s == null || isNaN(s) ? 'na' : s < 0.5 ? 'b3' : s < 0.8 ? 'b2' : s < 0.95 ? 'b1' : s <= 1.05 ? 'mid' : s <= 1.25 ? 'r1' : s <= 1.6 ? 'r2' : 'r3');
  const sirCell = (m) => {
    if (!m || m[2] == null) return '<td class="sir na" data-tip="Not reported">—</td>';
    return `<td class="sir ${sirClass(m[2])}" data-tip="Observed ${CIE.num(m[0])} · predicted ${CIE.num(m[1], 1)} · SIR ${m[2].toFixed(2)}">${m[2].toFixed(2)}</td>`;
  };
  // Excess = cases above predicted, summed over measures (measures better than predicted add nothing).
  const excessOf = (r) => Object.values(r.m || {}).reduce((t, m) => t + (m && m[0] != null && m[1] != null ? Math.max(0, m[0] - m[1]) : 0), 0);
  const observedOf = (r) => Object.values(r.m || {}).reduce((t, m) => t + (m && m[0] != null ? m[0] : 0), 0);
  const worseCount = (r) => Object.values(r.m || {}).filter((m) => m && m[2] != null && m[2] > 1).length;
  CIE.qualityData = (ws) => (ws.datasets && ws.datasets.quality) || null;

  function pooled(rows, measures) {
    return measures.map((ms) => {
      let o = 0, p = 0, worse = 0, rep = 0;
      rows.forEach((r) => { const m = r.m && r.m[ms.key]; if (m && m[0] != null && m[1] != null) { o += m[0]; p += m[1]; rep++; if (m[2] != null && m[2] > 1) worse++; } });
      return { ms, o, p, sir: p ? o / p : null, worse, rep };
    });
  }

  /* ---------- facility profile (drawer + presentation) ---------- */
  function profileHtml(ws, r, Q, present) {
    const P = pooled([r], Q.measures);
    const cost = (ms, k) => (ms.cost ? ms.cost[k] : 0);
    const exposure = Q.measures.reduce((t, ms) => { const m = r.m[ms.key]; return t + (m && m[0] != null && m[1] != null ? Math.max(0, m[0] - m[1]) * cost(ms, 1) : 0); }, 0);
    const maxSir = Math.max(2, ...P.map((x) => x.sir || 0));
    const facts = [
      ['Location', [r.city, r.state].filter(Boolean).join(', ')], ['Type', r.type], ['Ownership', r.owner],
      ['Overall star rating', r.rating ? r.rating + ' / 5' : '—'], ['Leapfrog grade', r.leapfrog || '—'],
      ['HAC score', r.hac != null ? r.hac.toFixed(3) : '—'], ['HAC payment reduction', r.hacPenalty ? 'Yes — penalised' : 'No'],
      ['Total beds', CIE.num(r.beds)], ['Critical-care beds', CIE.num(r.cc)], ['ICU beds', CIE.num(r.icu)],
    ];
    return `
      <div class="${present ? 'present-head' : ''}">
        <h2>${esc(r.name)}</h2>
        <div class="row" style="margin-top:6px">${r.rank ? `<span class="tag">Priority rank #${r.rank}</span>` : ''}${r.priority != null ? `<span class="tag">Priority score ${r.priority}</span>` : ''}<span class="tag">${esc(r.state || '')}</span>${r.leapfrog ? `<span class="tag">Leapfrog ${esc(r.leapfrog)}</span>` : ''}${r.hacPenalty ? '<span class="tag">HAC penalty</span>' : ''}</div>
        <p class="small muted" style="margin-top:6px">${esc(Q.source || '')}${Q.period ? ' · reporting period ' + esc(Q.period) : ''}</p>
      </div>
      <div class="grid g4" style="margin-top:12px">
        <div class="card kpi"><div class="label">Observed infections</div><div class="value">${CIE.num(observedOf(r))}</div><div class="foot">${Q.measures.length} measures</div></div>
        <div class="card kpi"><div class="label">Excess cases above predicted</div><div class="value">${CIE.num(excessOf(r), 1)}</div><div class="foot">Σ max(0, observed − predicted)</div></div>
        <div class="card kpi"><div class="label">Measures worse than national</div><div class="value">${worseCount(r)}</div><div class="foot">SIR above 1.0</div></div>
        <div class="card kpi"><div class="label">Excess-case cost exposure</div><div class="value">${CIE.money(exposure)}</div><div class="foot">base cost per case · indicative</div></div>
      </div>
      <div class="grid g2" style="margin-top:14px">
        <div class="card"><div class="card-head"><h3>Standardized infection ratio by measure</h3><span class="sub">tick = national baseline (1.0)</span></div>
          ${CIE.charts.barList(P.map((x) => ({ label: x.ms.name, value: x.sir == null ? 0 : +x.sir.toFixed(2), color: x.sir == null ? 'var(--axis)' : x.sir > 1 ? 'var(--div-r3)' : 'var(--div-b3)', marker: 1 / maxSir, tip: `${x.ms.full || x.ms.name}: SIR ${x.sir == null ? 'n/a' : x.sir.toFixed(2)}` })), { max: maxSir, labelWidth: 120, width: 520, format: (v) => (v ? v.toFixed(2) : 'n/a'), title: 'SIR by measure' })}
          <p class="small muted">Below 1.0 = fewer infections than predicted for a hospital of this size and case mix; above 1.0 = more.</p></div>
        <div class="card"><div class="card-head"><h3>Observed vs predicted</h3></div>
          ${CIE.charts.columns(P.map((x) => ({ label: x.ms.name, values: [x.o, +x.p.toFixed(1)] })), [{ label: 'Observed', color: 'var(--s2)' }, { label: 'Predicted', color: 'var(--s1)' }], { format: (v) => CIE.num(v), title: 'Observed vs predicted' })}</div>
      </div>
      <div class="card" style="margin-top:14px"><div class="card-head"><h3>Measure detail</h3></div>
        <div class="table-wrap"><table><thead><tr><th>Measure</th><th class="r">Observed</th><th class="r">Predicted</th><th class="r">SIR</th><th class="r">Excess</th><th class="r">Exposure</th><th>Denominator</th><th class="r">Rate</th></tr></thead><tbody>
        ${Q.measures.map((ms) => { const m = r.m[ms.key]; if (!m) return `<tr><td><b>${esc(ms.name)}</b></td><td colspan="7" class="muted">Not reported</td></tr>`;
          const ex = m[0] != null && m[1] != null ? m[0] - m[1] : null; const rate = m[3] ? (m[0] / m[3]) * (ms.per || 1000) : null;
          return `<tr><td><b>${esc(ms.name)}</b><div class="small muted">${esc(ms.full || '')}</div></td><td class="r num">${CIE.num(m[0])}</td><td class="r num">${CIE.num(m[1], 1)}</td>${sirCell(m)}<td class="r num">${ex == null ? '—' : (ex >= 0 ? '+' : '') + ex.toFixed(1)}</td><td class="r num">${ex > 0 ? CIE.money(ex * cost(ms, 1)) : '—'}</td><td class="num">${m[3] ? CIE.num(m[3]) + ' ' + esc(ms.denom || '') : '—'}</td><td class="r num">${rate == null ? '—' : rate.toFixed(2) + ' / ' + CIE.num(ms.per || 1000)}</td></tr>`; }).join('')}
        </tbody></table></div></div>
      <div class="grid g2" style="margin-top:14px">
        <div class="card"><div class="card-head"><h3>Facility facts</h3></div><dl class="kv">${facts.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v || '—')}</dd>`).join('')}</dl></div>
        <div class="card"><div class="card-head"><h3>Commercial read</h3></div><dl class="kv">
          ${r.wedge ? `<dt>Lead workflow</dt><dd>${esc(r.wedge)}</dd>` : ''}${r.rationale ? `<dt>Rationale</dt><dd>${esc(r.rationale)}</dd>` : ''}${r.whyNow ? `<dt>Why now</dt><dd>${esc(r.whyNow)}</dd>` : ''}${r.access ? `<dt>Access</dt><dd>${esc(r.access)}</dd>` : ''}
          </dl>${!r.wedge && !r.whyNow ? '<p class="muted small">No commercial notes for this facility.</p>' : ''}</div>
      </div>`;
  }

  CIE.openFacility = function (ctx, id) {
    const ws = ctx.ws, Q = CIE.qualityData(ws);
    const r = Q && Q.rows.find((x) => x.id === id);
    if (!r) return CIE.toast('No facility data for this account');
    ctx.openDrawer(`<div class="row" style="justify-content:flex-end;margin-bottom:6px"><button class="btn primary sm" id="presentBtn">Present full screen ⤢</button></div>` + profileHtml(ws, r, Q, false), (d) => {
      d.classList.add('wide');
      d.querySelector('#presentBtn').onclick = () => CIE.presentFacility(ctx, id);
    });
  };

  CIE.presentFacility = function (ctx, id) {
    const ws = ctx.ws, Q = CIE.qualityData(ws);
    const r = Q.rows.find((x) => x.id === id);
    ctx.closeDrawer();
    const ov = document.createElement('div');
    ov.className = 'present';
    const list = view.list || [r.id];
    const pos = list.indexOf(r.id);
    ov.innerHTML = `<div class="present-bar"><span class="muted small">${esc(Q.title || 'Facility quality')} · ${pos >= 0 ? pos + 1 + ' of ' + list.length : ''} · ← → to move, Esc to close</span><span class="row"><button class="btn sm" data-p="-1">← Previous</button><button class="btn sm" data-p="1">Next →</button><button class="btn sm" onclick="window.print()">Print / PDF</button><button class="btn sm" data-x>Close ✕</button></span></div><div class="present-body">${profileHtml(ws, r, Q, true)}</div>`;
    document.body.appendChild(ov);
    const go = (d) => { const i = list.indexOf(r.id) + d; if (i >= 0 && i < list.length) { ov.remove(); document.removeEventListener('keydown', key); CIE.presentFacility(ctx, list[i]); } };
    const key = (e) => { if (e.key === 'Escape') { ov.remove(); document.removeEventListener('keydown', key); } if (e.key === 'ArrowRight') go(1); if (e.key === 'ArrowLeft') go(-1); };
    document.addEventListener('keydown', key);
    ov.addEventListener('click', (e) => { if (e.target.hasAttribute('data-x')) { ov.remove(); document.removeEventListener('keydown', key); } const p = e.target.getAttribute('data-p'); if (p) go(Number(p)); });

  CIE.registerModule({

    describe: 'Infection data per facility: observed, predicted, SIR, rates, with a presentation view.',
    render(root, ctx) {

      }
      const all = Q.rows;

      let rows = all.filter((r) =>
        (!view.q || (r.name + ' ' + (r.city || '')).toLowerCase().includes(view.q.toLowerCase())) &&

        (!view.worse || worseCount(r) > 0) && (!view.hac || r.hacPenalty) && (!view.minBeds || (r.beds || 0) >= view.minBeds));
      const key = view.sort;
      const val = (r) => key === 'name' ? r.name : key === 'beds' ? r.beds || 0 : key === 'observed' ? observedOf(r) : key === 'excess' ? excessOf(r) : key === 'worse' ? worseCount(r) : key === 'priority' ? (r.priority != null ? r.priority : -1) : r.m && r.m[key] && r.m[key][2] != null ? r.m[key][2] : -1;
      rows.sort((a, b) => { const x = val(a), y = val(b); return (typeof x === 'string' ? x.localeCompare(y) : x - y) * view.dir; });
      view.list = rows.map((r) => r.id);
      const P = pooled(rows, Q.measures);
      const totO = P.reduce((t, x) => t + x.o, 0), totP = P.reduce((t, x) => t + x.p, 0), totEx = rows.reduce((t, r) => t + excessOf(r), 0);
      const maxSir = Math.max(1.5, ...P.map((x) => x.sir || 0));
      const th = (k, l, cls) => `<th class="sortable ${cls || ''}" data-sort="${k}">${l}${view.sort === k ? (view.dir < 0 ? ' ▼' : ' ▲') : ''}</th>`;

      root.innerHTML = `
        <div class="page-head"><div><h2>${esc(Q.title || 'Facility quality (HAI)')}</h2><p>${esc(Q.source || '')}${Q.period ? ' · ' + esc(Q.period) : ''}. Click any facility for its full profile, then <b>Present</b> for a clean full-screen view you can page through with the arrow keys.</p></div>
          <div class="row"><button class="btn" id="csv">Export CSV (${rows.length})</button>${rows[0] ? '<button class="btn primary" id="present">Present filtered list ⤢</button>' : ''}</div></div>
        <div class="row" style="margin-bottom:12px">
          <input id="fq" placeholder="Search facility or city…" value="${esc(view.q)}" style="min-width:220px">
          <select id="fs"><option value="">All states</option>${states.map((s) => `<option ${s === view.state ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>
          ${types.length > 1 ? `<select id="ft"><option value="">All types</option>${types.map((s) => `<option ${s === view.type ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>` : ''}
          ${grades.length ? `<select id="fg"><option value="">Any Leapfrog grade</option>${grades.map((s) => `<option ${s === view.grade ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>` : ''}
          <label class="field" style="flex-direction:row;align-items:center;gap:6px">Min beds<input type="number" id="fb" value="${view.minBeds || ''}" style="width:80px"></label>
