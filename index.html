<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sabrina Price Watch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#f6f1e8; --paper:#fffcf7; --ink:#171412; --muted:#8a8178; --line:#eadfd3; --green:#1f7a4d; --green-soft:#e7f5ee; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: Inter, system-ui, sans-serif; }
    body { padding-bottom: calc(112px + env(safe-area-inset-bottom)); overflow-x: hidden; }
    header.app { position: sticky; top: 0; z-index: 20; background: rgba(246,241,232,.94); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); padding: 14px 16px 12px; }
    .hero { display: flex; align-items: center; gap: 14px; }
    .logo { width: 64px; height: 64px; border-radius: 18px; overflow: hidden; background: #f4b3c6; flex: 0 0 auto; box-shadow: 0 8px 18px rgba(210,120,150,.18); }
    .logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .hero h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -.04em; line-height: 1.05; }
    .hero p { margin: 6px 0 0; color: var(--muted); font-size: 14px; font-weight: 500; }
    .pills { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 4px; }
    .pill { color: #fff; font-size: 13px; font-weight: 700; padding: 8px 14px; border-radius: 999px; }
    .pill.walmart { background: #2f7cf6; }
    .pill.target { background: #c0392b; }
    .pill.wf { background: #2f8f4e; }
    .pill.sams { background: #16325c; }
    header.app .lede { margin: 8px 0 6px; color: var(--muted); font-size: 13px; }
    #asOf { font-weight: 600; color: var(--ink); }
    label.field { display: block; font-size: 13px; font-weight: 600; margin: 10px 0 6px; }
    .search, .addrow input { width: 100%; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font: inherit; background: #fff; font-size: 16px; }
    .addrow { display: flex; gap: 8px; }
    .addrow input { flex: 1; min-width: 0; }
    .addrow button, .btn { border: 0; background: #171412; color: #fff; border-radius: 14px; padding: 12px 16px; font-weight: 700; font: inherit; cursor: pointer; }
    .btn.ghost { background: #fff; color: #171412; border: 1px solid var(--line); }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px 0; -webkit-overflow-scrolling: touch; }
    .chip { flex: 0 0 auto; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 8px 12px; font-size: 13px; font-weight: 600; }
    .chip.on { background: #171412; color: #fff; }
    main { padding: 8px 16px 24px; max-width: 760px; margin: 0 auto; }
    .aisle { margin: 18px 0 8px; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
    .card { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin: 10px 0; }
    .name { font-weight: 700; font-size: 16px; line-height: 1.25; }
    .meta { color: var(--muted); font-size: 12px; margin: 4px 0 10px; }
    .stores { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    button.store { text-align: left; border: 1.5px solid var(--line); background: #fff; border-radius: 12px; padding: 10px; min-height: 68px; font: inherit; cursor: pointer; }
    button.store .s { font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    button.store .u { display: block; font-size: 18px; font-weight: 700; margin-top: 2px; }
    button.store .p { display: block; font-size: 11px; color: var(--muted); }
    button.store.best { border-color: var(--green); background: var(--green-soft); }
    button.store.picked { outline: 2px solid #171412; }
    button.store.miss .u { font-size: 13px; font-weight: 600; color: var(--muted); }
    .cap { margin-top: 8px; font-size: 12px; color: var(--muted); }
    .patch { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    footer.cart { position: fixed; left: 0; right: 0; bottom: 0; background: #171412; color: #fff; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
    footer.cart .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; max-width: 760px; margin: 0 auto; }
    .bags { margin-top: 6px; font-size: 12px; color: #ddd6c8; }
    .empty, .err { padding: 32px 8px; text-align: center; color: var(--muted); }
    dialog { border: 0; border-radius: 16px; padding: 18px; width: min(420px, 92vw); }
    dialog::backdrop { background: rgba(0,0,0,.35); }
    dialog input, dialog select { width: 100%; padding: 12px; margin: 6px 0; border-radius: 10px; border: 1px solid var(--line); font: inherit; font-size: 16px; }
  </style>
</head>
<body>
  <header class="app">
    <div class="hero">
      <div class="logo"><img alt="" src="icon.jpg" /></div>
      <div>
        <h1>Sabrina Price Watch</h1>
        <p>Compare grocery prices across stores</p>
      </div>
    </div>
    <div class="pills">
      <span class="pill walmart">Walmart</span>
      <span class="pill target">Target</span>
      <span class="pill wf">Whole Foods</span>
      <span class="pill sams">Sam’s</span>
    </div>
    <p class="lede">Unit price. Green is cheapest. Prices as of <span id="asOf">…</span>.</p>
    <label class="field" for="q">Find an item</label>
    <input class="search" id="q" placeholder="Avocado, Doritos, ketchup…" />
    <label class="field" for="newName">Add a product she buys</label>
    <div class="addrow">
      <input id="newName" placeholder="Type the name, then Add" />
      <button id="addBtn" type="button">Add</button>
    </div>
  </header>
  <div class="chips" id="chips"></div>
  <main id="list"><p class="lede" style="padding:16px">Loading catalog…</p></main>
  <footer class="cart" id="cart"></footer>
  <dialog id="dlg"></dialog>
  <script src="app.js"></script>
</body>
</html>
