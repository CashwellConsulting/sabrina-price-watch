<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fbf6f3" />
  <title>Sabrina Price Watch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fbf6f3;          /* warm blush-ivory page */
      --paper: #ffffff;
      --ink: #2e1f28;         /* deep plum ink */
      --muted: #8c7b83;
      --line: #f0e4e3;
      --blush: #f6d9dd;
      --blush-soft: #fcedef;
      --berry: #b0436a;       /* primary accent */
      --sage: #3f7d5c;        /* "best price" */
      --sage-soft: #eaf4ee;
      --shadow: 0 1px 2px rgba(46,31,40,.04), 0 6px 20px rgba(176,67,106,.06);
      --walmart: #2f7cf6; --target: #cc2a36; --whole_foods: #2f8f4e; --sams: #1d3f73;
      --display: "Fraunces", Georgia, "Times New Roman", serif;
      --body: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); -webkit-font-smoothing: antialiased; }
    body { padding-bottom: calc(108px + env(safe-area-inset-bottom)); overflow-x: hidden; font-size: 15px; line-height: 1.45; }
    button { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--berry); outline-offset: 2px; }

    /* Hero: scrolls away so the list gets the screen */
    .hero { display: flex; align-items: center; gap: 14px; padding: calc(18px + env(safe-area-inset-top)) 20px 6px; max-width: 760px; margin: 0 auto; }
    .logo { width: 60px; height: 60px; flex: 0 0 auto; border-radius: 18px; overflow: hidden; background: #fff; box-shadow: 0 6px 18px rgba(176,67,106,.22); }
    .logo img { width: 100%; height: 100%; display: block; object-fit: contain; }
    .hero h1 { margin: 0; font-family: var(--display); font-weight: 500; font-size: 27px; line-height: 1.1; letter-spacing: -.015em; font-variation-settings: "opsz" 72; }
    .hero h1 em { font-style: italic; color: var(--berry); font-weight: 400; }
    .hero p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    #asOf { color: var(--ink); font-weight: 600; white-space: nowrap; }

    /* Sticky tools: search + filters only */
    .tools { position: sticky; top: 0; z-index: 20; background: rgba(251,246,243,.92); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); padding: 10px 0 10px; border-bottom: 1px solid transparent; transition: border-color .2s; }
    .tools.stuck { border-bottom-color: var(--line); }
    .searchwrap { position: relative; max-width: 760px; margin: 0 auto; padding: 0 20px; }
    .searchwrap svg { position: absolute; left: 36px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
    .search { width: 100%; border: 1px solid var(--line); border-radius: 999px; padding: 12px 16px 12px 44px; font: inherit; font-size: 16px; background: var(--paper); color: var(--ink); box-shadow: var(--shadow); }
    .search::placeholder, .addrow input::placeholder { color: #b3a4aa; }
    .search:focus, .addrow input:focus { outline: none; border-color: var(--berry); box-shadow: 0 0 0 4px var(--blush-soft); }
    .chips { display: flex; gap: 6px; overflow-x: auto; padding: 10px 20px 2px; max-width: 760px; margin: 0 auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: 0 0 auto; border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 7px 13px; font-size: 13px; font-weight: 600; color: var(--ink); cursor: pointer; }
    .chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }

    main { padding: 4px 20px 16px; max-width: 760px; margin: 0 auto; }
    .aisle { display: flex; align-items: baseline; gap: 8px; margin: 22px 2px 8px; font-family: var(--display); font-style: italic; font-size: 20px; font-weight: 500; }
    .aisle small { font-family: var(--body); font-style: normal; font-size: 12px; color: var(--muted); font-weight: 500; }

    .card { background: var(--paper); border-radius: 20px; padding: 16px; margin: 10px 0; box-shadow: var(--shadow); border: 1px solid rgba(240,228,227,.7); }
    .brand { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--berry); margin-bottom: 2px; }
    .name { font-family: var(--display); font-weight: 500; font-size: 19px; line-height: 1.2; letter-spacing: -.01em; font-variation-settings: "opsz" 36; }
    .meta { color: var(--muted); font-size: 12.5px; margin: 3px 0 12px; }
    .pendtag { display: inline-block; background: var(--blush-soft); color: var(--berry); font-weight: 600; font-size: 11px; padding: 2px 8px; border-radius: 99px; }
    .meta .pendtag:not(:first-child) { margin-left: 6px; }

    .stores { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    button.store { position: relative; min-width: 0; text-align: left; border: 1.5px solid var(--line); background: var(--paper); border-radius: 14px; padding: 10px 11px; min-height: 72px; cursor: pointer; transition: border-color .15s, background .15s, transform .1s; }
    button.store:active { transform: scale(.98); }
    button.store .s { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--ink); }
    button.store .s i { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; background: var(--dot, var(--muted)); }
    button.store .u { display: block; font-size: 18px; font-weight: 700; margin-top: 4px; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
    button.store .u small { font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
    button.store .p { display: block; font-size: 11.5px; color: var(--muted); margin-top: 1px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    button.store.picked .p { padding-right: 24px; }
    button.store.best { border-color: var(--sage); background: var(--sage-soft); }
    button.store.best::after { content: "Best price"; position: absolute; top: -9px; right: 10px; background: var(--sage); color: #fff; font-size: 10px; font-weight: 700; letter-spacing: .03em; padding: 2px 8px; border-radius: 99px; }
    button.store.picked { border-color: var(--berry); box-shadow: 0 0 0 1.5px var(--berry) inset; }
    button.store.picked::before { content: "✓"; position: absolute; bottom: 9px; right: 10px; width: 20px; height: 20px; border-radius: 50%; background: var(--berry); color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; }
    button.store.miss { background: #fdfafa; border-style: dashed; }
    button.store.miss .u { font-size: 13px; font-weight: 600; color: var(--muted); }
    button.store:disabled { cursor: default; opacity: .7; }
    .cap { margin-top: 10px; font-size: 12px; color: var(--muted); }
    .patch { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

    .btn { border: 0; background: var(--ink); color: #fff; border-radius: 999px; padding: 11px 18px; font-weight: 600; font-size: 14px; cursor: pointer; }
    .btn.ghost { background: var(--paper); color: var(--ink); border: 1px solid var(--line); }
    .btn.berry { background: var(--berry); }

    .addcard { background: var(--blush-soft); border: 1px dashed #e8c3cb; border-radius: 20px; padding: 16px; margin: 22px 0 8px; box-shadow: none; }
    .addcard h2 { margin: 0 0 2px; font-family: var(--display); font-weight: 500; font-size: 18px; }
    .addcard p { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
    .addrow { display: flex; gap: 8px; }
    .addrow input { flex: 1; min-width: 0; border: 1px solid #efd6db; border-radius: 999px; padding: 11px 16px; font: inherit; font-size: 16px; background: var(--paper); color: var(--ink); }

    footer.cart { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 30; background: var(--ink); color: #fff; border-radius: 22px; padding: 12px 12px 12px 18px; box-shadow: 0 12px 32px rgba(46,31,40,.28); max-width: 736px; margin: 0 auto; }
    footer.cart .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    footer.cart b { font-size: 16px; font-variant-numeric: tabular-nums; }
    .bags { margin-top: 3px; font-size: 12px; color: #d9c7cf; display: flex; flex-wrap: wrap; gap: 4px 12px; }
    .bags span { display: inline-flex; align-items: center; gap: 5px; }
    .bags i { width: 7px; height: 7px; border-radius: 50%; }
    footer.cart .btn { background: rgba(255,255,255,.12); color: #fff; padding: 9px 14px; font-size: 13px; }
    footer.cart .btn.plan { background: var(--blush); color: var(--ink); font-weight: 700; }
    .cartbtns { display: flex; gap: 6px; flex: 0 0 auto; }

    /* Plan my trip sheet */
    dialog.sheet { width: min(560px, 100vw); max-width: 100vw; max-height: 92vh; margin: auto auto 0; padding: 18px 20px calc(20px + env(safe-area-inset-bottom)); border-radius: 24px 24px 0 0; background: var(--bg); overflow-y: auto; }
    @media (min-width: 600px) { dialog.sheet { margin: auto; border-radius: 24px; } }
    .planhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .planhead h3 { font-size: 24px; }
    .planhead .x { border: 0; background: var(--paper); width: 34px; height: 34px; border-radius: 50%; font-size: 20px; line-height: 1; cursor: pointer; box-shadow: var(--shadow); }
    .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 4px; margin-bottom: 14px; }
    .seg button { border: 0; background: none; border-radius: 999px; padding: 8px 6px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .seg button.on { background: var(--ink); color: #fff; }
    .seg button:disabled { opacity: .4; cursor: default; }
    .verdict { border-radius: 18px; padding: 14px 16px; margin-bottom: 10px; }
    .verdict.go2 { background: var(--sage-soft); border: 1px solid #cfe5d8; }
    .verdict.go1 { background: var(--blush-soft); border: 1px solid #f1d3da; }
    .verdict small { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .verdict b { display: block; font-family: var(--display); font-weight: 500; font-size: 24px; line-height: 1.15; margin: 2px 0 4px; }
    .verdict p { margin: 0; font-size: 14px; }
    .verdict strong { color: var(--sage); }
    .worth { font-size: 13px; color: var(--muted); display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin: 0 0 16px; }
    .stepper { display: inline-flex; align-items: center; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; }
    .stepper button { border: 0; background: none; width: 30px; height: 28px; font-size: 16px; cursor: pointer; }
    .stepper b { color: var(--ink); min-width: 32px; text-align: center; font-variant-numeric: tabular-nums; }
    .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 14px 2px 8px; }
    .bars { display: grid; gap: 6px; background: var(--paper); border-radius: 16px; padding: 12px; box-shadow: var(--shadow); }
    .bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "l v" "t v"; align-items: center; column-gap: 12px; row-gap: 5px; font-size: 13px; padding: 7px 8px; border-radius: 10px; }
    .bl { grid-area: l; } .bt { grid-area: t; } .bv { grid-area: v; }
    .bar.pick { background: var(--sage-soft); font-weight: 600; }
    .bl { display: flex; align-items: center; gap: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bl i, .stophead i { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; display: inline-block; }
    .bl i:last-of-type { margin-right: 3px; }
    .bt { height: 10px; background: var(--blush-soft); border-radius: 99px; overflow: hidden; }
    .bt span { display: block; height: 100%; background: #d8a9b8; border-radius: 99px; }
    .bar.pick .bt span { background: var(--sage); }
    .bv { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
    .bv small { display: block; font-weight: 500; font-size: 10.5px; color: var(--muted); }
    .stop { background: var(--paper); border-radius: 16px; padding: 12px 14px; margin-bottom: 8px; box-shadow: var(--shadow); }
    .stophead { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); padding-bottom: 6px; border-bottom: 1px solid var(--line); }
    .stophead span:first-child { display: inline-flex; align-items: center; gap: 6px; font-family: var(--display); font-size: 18px; color: var(--ink); }
    .stop ul { list-style: none; margin: 0; padding: 0; }
    .stop li { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; font-size: 13.5px; border-bottom: 1px dashed var(--line); }
    .stop li:last-child { border-bottom: 0; }
    .stop li span:last-child { color: var(--muted); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; flex: 0 0 auto; max-width: 50%; }
    .stop.miss { background: #fdfafa; box-shadow: none; border: 1px dashed var(--line); }
    .planfoot { margin-top: 14px; display: grid; gap: 8px; }
    .planfoot .btn { width: 100%; padding: 14px; font-size: 15px; }
    .planfoot p { margin: 0; font-size: 11.5px; color: var(--muted); text-align: center; }

    .empty, .err { padding: 40px 8px; text-align: center; color: var(--muted); }
    .empty b { display: block; font-family: var(--display); font-style: italic; font-weight: 500; font-size: 20px; color: var(--ink); margin-bottom: 4px; }

    dialog { border: 0; border-radius: 22px; padding: 20px; width: min(420px, 92vw); color: var(--ink); box-shadow: 0 24px 60px rgba(46,31,40,.25); }
    dialog::backdrop { background: rgba(46,31,40,.35); backdrop-filter: blur(2px); }
    dialog h3 { margin: 0; font-family: var(--display); font-weight: 500; font-size: 21px; }
    dialog input, dialog select { width: 100%; padding: 12px 14px; margin: 5px 0; border-radius: 12px; border: 1px solid var(--line); font: inherit; font-size: 16px; background: #fff; color: var(--ink); }
    dialog input::-webkit-outer-spin-button, dialog input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    dialog input[type=number] { -moz-appearance: textfield; }
    dialog .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <header class="hero">
    <div class="logo"><img src="sabrina-s.svg?v=white1" alt="" width="60" height="60" /></div>
    <div>
      <h1>Sabrina <em>Price Watch</em></h1>
      <p>Best unit price at four stores · updated <span id="asOf">…</span></p>
    </div>
  </header>
  <div class="tools" id="tools">
    <div class="searchwrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input class="search" id="q" type="search" placeholder="Search avocado, Doritos, ketchup…" aria-label="Find an item" autocomplete="off" />
    </div>
    <div class="chips" id="chips"></div>
  </div>
  <main id="list"><p class="empty">Loading her list…</p></main>
  <section style="max-width:760px;margin:0 auto;padding:0 20px">
    <div class="addcard">
      <h2>Don’t see something?</h2>
      <p>Add it here, then tap a store to enter its price.</p>
      <div class="addrow">
        <input id="newName" placeholder="e.g. Greek yogurt" aria-label="New product name" />
        <button id="addBtn" type="button" class="btn berry">Add</button>
      </div>
    </div>
  </section>
  <footer class="cart" id="cart"></footer>
  <dialog id="dlg"></dialog>
  <dialog id="planDlg" class="sheet" aria-label="Plan my trip"></dialog>
  <script src="app.js?v=11"></script>
  <script src="plan.js?v=11"></script>
</body>
</html>
